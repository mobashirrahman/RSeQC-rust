# RSeQC command inventory (Step 1 / G0, docs/PORTING_PLAN.md)
# Generated by swarm investigators (zai, lag) from oracle/upstream-src; reviewed by coordinator.
commands:
  - name: bam_stat.py
    purpose: Summarize mapping statistics for a BAM or SAM alignment file
    key_options: -i/--input-file (required), -q/--mapq (default=30)
    outputs: stdout (statistics table)
    external_deps: qcmodule.SAM
    notes: None

  - name: bam2fq.py
    purpose: Convert alignments in BAM or SAM format to FASTQ
    key_options: -i/--input-file (required), -o/--out-prefix (required), -s/--single-end, -c/--compress
    outputs: .fastq files (optionally .fastq.gz)
    external_deps: qcmodule.SAM, gzip
    notes: Preserves mate relationships, can compress output

  - name: divide_bam.py
    purpose: Randomly divide a BAM file into approximately equal subsets
    key_options: -i/--input-file (required), -n/--subset-num (required), -o/--out-prefix (required), -s/--skip-unmap, --seed, --index
    outputs: Multiple .bam files (<prefix>_<index>.bam), optional .bai indexes
    external_deps: pysam, random
    notes: Keeps paired mates together, uses random seed for reproducibility

  - name: split_bam.py
    purpose: Split a BAM file according to exon regions from a BED gene list
    key_options: -i/--input-file (required), -r/--genelist (required), -o/--out-prefix (required), --index-output, --overwrite, --verbose
    outputs: .in.bam, .ex.bam, .junk.bam files, optional .bai indexes
    external_deps: pysam, bx.intervals.intersection, qcmodule.BED, qcmodule
    notes: Three-way split based on exon overlap, preserves original classification algorithm

  - name: split_paired_bam.py
    purpose: Split a paired-end BAM into read-1, read-2, and unmapped BAM files
    key_options: -i/--input-file (required), -o/--out-prefix (required), --index-output, --overwrite, --verbose
    outputs: .R1.bam, .R2.bam, .unmap.bam files, optional .bai indexes
    external_deps: pysam
    notes: Converts to single-end, preserves historical flag conversion behavior

  - name: read_GC.py
    purpose: Calculate the GC-content distribution of aligned reads
    key_options: -i/--input-file (required), -o/--out-prefix (required), -q/--mapq (default=30), --skip-plot, --rscript
    outputs: .GC_plot.r script, .GC.pdf plot (unless skipped)
    external_deps: qcmodule.SAM, subprocess, shutil
    notes: Generates R script for plotting, can skip plot generation

  - name: read_NVC.py
    purpose: Calculate nucleotide frequency at each read cycle
    key_options: -i/--input-file (required), -o/--out-prefix (required), -x/--nx, -q/--mapq (default=30), --skip-plot, --rscript
    outputs: .NVC_plot.r script, .NVC.pdf plot (unless skipped)
    external_deps: qcmodule.SAM, subprocess, shutil
    notes: Generates R script, can include ambiguous nucleotides

  - name: read_quality.py
    purpose: Calculate per-cycle Phred quality-score distributions for aligned reads
    key_options: -i/--input-file (required), -o/--out-prefix (required), -r/--reduce (default=1), -q/--mapq (default=30), --skip-plot, --rscript
    outputs: .qual.r script, .qual.pdf plot (unless skipped)
    external_deps: qcmodule.SAM, subprocess, shutil
    notes: Generates R script, reduces data for boxplot precision

  - name: read_duplication.py
    purpose: Calculate sequence-based and mapping-based read duplication rates
    key_options: -i/--input-file (required), -o/--out-prefix (required), -u/--up-limit (default=500), -q/--mapq (default=30), --skip-plot, --rscript
    outputs: .DupRate_plot.r script, .DupRate.pdf plot (unless skipped)
    external_deps: qcmodule.SAM, subprocess, shutil
    notes: Calculates both sequence and mapping duplication, generates R plots

  - name: clipping_profile.py
    purpose: Estimate the clipping profile of RNA-seq reads from a BAM or SAM file
    key_options: -i/--input-file (required), -o/--out-prefix (required), -q/--mapq (default=30), -s/--sequencing (required), --skip-plot, --rscript
    outputs: .clipping_profile.r script, .clipping_profile.pdf plot (unless skipped)
    external_deps: qcmodule.SAM, subprocess, shutil
    notes: Requires soft-clipping CIGAR operations, generates R plots

  - name: deletion_profile.py
    purpose: Calculate the distribution of deleted nucleotides across aligned reads
    key_options: -i/--input (required), -l/--read-align-length (required), -o/--out-prefix (required), -n/--read-num (default=1000000), -q/--mapq (default=30), --skip-plot, --rscript
    outputs: .deletion_profile.r script, .deletion_profile.pdf plot (unless skipped)
    external_deps: qcmodule.SAM, subprocess, shutil
    notes: Samples limited number of reads with deletions, generates R plots

  - name: insertion_profile.py
    purpose: Calculate the distribution of inserted nucleotides across RNA-seq reads
    key_options: -i/--input-file (required), -o/--out-prefix (required), -q/--mapq (default=30), -s/--sequencing (required), --skip-plot, --rscript
    outputs: .insertion_profile.r script, .insertion_profile.pdf plot (unless skipped)
    external_deps: qcmodule.SAM, subprocess, shutil
    notes: Generates R plots for single-end or paired-end data

  - name: mismatch_profile.py
    purpose: Calculate the distribution of mismatches across aligned reads
    key_options: -i/--input (required), -l/--read-align-length (required), -o/--out-prefix (required), -n/--read-num (default=1000000), -q/--mapq (default=30), --skip-plot, --rscript
    outputs: .mismatch_profile.r script, .mismatch_profile.pdf plot (unless skipped)
    external_deps: qcmodule.SAM, subprocess, shutil
    notes: BAM must contain MD tags, samples limited number of reads

  - name: read_hexamer.py
    purpose: Calculate normalized hexamer frequencies from FASTA or FASTQ files
    key_options: -i/--input (required), -r/--refgenome, -g/--refgene, -o/--output, --skip-missing
    outputs: stdout (frequency table), optional output file
    external_deps: qcmodule.FrameKmer
    notes: Handles multiple input files, skips hexamers containing N

  - name: infer_experiment.py
    purpose: Infer RNA-seq library layout and strandedness from a SAM/BAM file
    key_options: -i/--input-file (required), -r/--refgene (required), -s/--sample-size (default=200000), -q/--mapq (default=30)
    outputs: stdout (inferred protocol information)
    external_deps: qcmodule.SAM
    notes: Requires non-strand-specific alignment, recommends 200K+ alignments

  - name: read_distribution.py
    purpose: Summarize read distribution across genomic annotation categories
    key_options: -i/--input-file (required), -r/--refgene (required)
    outputs: stdout (distribution table)
    external_deps: bx.intervals.intersection, qcmodule.BED, qcmodule.SAM, qcmodule.bam_cigar
    notes: Uses midpoint assignment with precedence order, preserves original algorithm

  - name: inner_distance.py
    purpose: Estimate the inner distance between paired-end RNA-seq reads
    key_options: -i/--input-file (required), -o/--out-prefix (required), -r/--refgene (required), -k/--sample-size (default=1000000), -l/--lower-bound (default=-250), -u/--upper-bound (default=250), -s/--step (default=5), -q/--mapq (default=30), --skip-plot, --rscript
    outputs: .inner_distance_plot.r script, .inner_distance.pdf plot (unless skipped)
    external_deps: qcmodule.SAM, subprocess, shutil
    notes: Can handle negative distances (overlapping reads), generates R plots

  - name: RNA_fragment_size.py
    purpose: Calculate fragment-size statistics for each transcript or gene
    key_options: -i/--input (required), -r/--refgene (required), -q/--mapq (default=30), -n/--frag-num (default=3), -o/--output
    outputs: stdout or file (fragment size statistics table)
    external_deps: numpy, pysam
    notes: Uses only read 1 from paired-end, requires coordinate-sorted indexed BAM

  - name: junction_annotation.py
    purpose: Annotate splice junctions against a reference gene model
    key_options: -i/--input-file (required), -r/--refgene (required), -o/--out-prefix (required), -m/--min-intron (default=50), -q/--mapq (default=30), --skip-plot, --rscript, --skip-bed, --skip-interact
    outputs: .junction.xls, .junction_plot.r script, .junction.pdf, .bed, .Interact.bed files
    external_deps: qcmodule.SAM, subprocess, shutil
    notes: Generates multiple output formats, consolidates junctions, creates BED and UCSC Interact tracks
  - name: bam2wig.py
    purpose: Convert a sorted, indexed BAM file into WIG coverage files.
    key_options:
      - -i/--input-file (required)
      - -s/--chrom-size (required)
      - -o/--out-prefix (required)
      - -t/--wigsum (default=None)
      - -u/--skip-multi-hits (default=false)
      - -d/--strand (default=None)
      - -q/--mapq (default=30)
    outputs:
      - <out_prefix>.wig (unstranded) or <out_prefix>.forward.wig / <out_prefix>.reverse.wig (stranded)
    external_deps: [qcmodule.SAM]
    notes: SAM input not supported; BAM index required; normalization optional via --wigsum.

  - name: geneBody_coverage.py
    purpose: Calculate RNA-seq read coverage across the gene body from BAM input.
    key_options:
      - -i/--input (required)
      - -r/--refgene (required)
      - -l/--minimum-length (default=100)
      - -f/--format (default=pdf; choices=pdf|png|jpeg)
      - -o/--out-prefix (required)
      - --skip-plot (default=false)
      - --rscript (default=Rscript)
    outputs:
      - <out_prefix>.geneBodyCoverage.txt
      - <out_prefix>.geneBodyCoverage.<format>
      - <out_prefix>.geneBodyCoverage.r
    external_deps: [numpy, pysam, qcmodule.getBamFiles, qcmodule.mystat, Rscript]
    notes: BAM only; transcripts shorter than --minimum-length skipped; min length 100 bp; generates and runs an R script for plotting.

  - name: geneBody_coverage2.py
    purpose: Calculate RNA-seq coverage across the gene body from a BigWig file.
    key_options:
      - -i/--input-file (required)
      - -r/--refgene (required)
      - -o/--out-prefix (required)
      - -t/--graph-type (default=pdf; choices=pdf|png|bmp|jpeg|tiff)
      - --skip-plot (default=false)
      - --rscript (default=Rscript)
    outputs:
      - <out_prefix>.geneBodyCoverage.txt
      - <out_prefix>.geneBodyCoverage.<graph_type>
      - <out_prefix>.geneBodyCoverage_plot.r
    external_deps: [numpy, pyBigWig, qcmodule.mystat, Rscript]
    notes: Deprecated sibling of geneBody_coverage.py — takes BigWig instead of BAM; R script generated then executed.

  - name: normalize_bigwig.py
    purpose: Normalize a BigWig signal to a fixed total WIG sum.
    key_options:
      - -i/--bwfile (required)
      - -o/--output (required)
      - -t/--wigsum (default=100000000)
      - -r/--refgene (default=None)
      - -c/--chunk (default=500000)
      - -f/--format (default=bgr; choices=wig|bgr)
      - --overwrite (default=false)
    outputs:
      - variableStep WIG file or bedGraph file (as specified by --format)
    external_deps: [numpy, pyBigWig, qcmodule.BED]
    notes: 100M wigsum corresponds to 1M 100-nt reads; with --refgene only merged-exon signal is used for normalization.

  - name: overlay_bigwig.py
    purpose: Apply an arithmetic operation to two BigWig signal tracks.
    key_options:
      - -i/--bwfile1 (required)
      - -j/--bwfile2 (required)
      - -a/--action (required; choices=Add|Average|Division|Max|Min|Product|Subtract|geometricMean)
      - -o/--output (required)
      - -c/--chunk (default=100000)
      - --overwrite (default=false)
    outputs:
      - <output>.wig (variableStep WIG)
    external_deps: [numpy, pyBigWig, qcmodule.BED, qcmodule.twoList]
    notes: Both files should use the same reference genome; Division uses qcmodule.twoList.

  - name: FPKM_count.py
    purpose: Calculate fragment counts, FPM, and FPKM for BED12 transcript models.
    key_options:
      - -i/--input-file (required)
      - -o/--out-prefix (required)
      - -r/--refgene (required)
      - -d/--strand (default=None)
      - -u/--skip-multi-hits (default=false)
      - -e/--only-exonic (default=false)
      - -q/--mapq (default=30)
      - -s/--single-read (default=1.0)
    outputs:
      - <out_prefix>.FPKM.xls
    external_deps: [bx.intervals.intersection, qcmodule.SAM]
    notes: BAM only; single-end and paired-end fragment counting differ; FPKM = frag_count * 1e9 / (denominator * mrna_size); denominator is exonic frags when --only-exonic else total.

  - name: FPKM-UQ.py
    purpose: Calculate raw counts, FPKM, and upper-quartile normalized FPKM (TCGA-compatible).
    key_options:
      - --bam (required)
      - --gtf (required)
      - --info (required)
      - -o/--output (required)
      - --log2 (default=false)
      - --htseq-count (default=htseq-count)
      - --print-htseq-command (default=false)
    outputs:
      - <out_prefix>.htseq.counts.txt
      - <out_prefix>.FPKM-UQ.txt
    external_deps: [numpy, subprocess(htseq-count), shlex]
    notes: Runs htseq-count with TCGA-fixed flags (-f bam -r pos -s no -a 10 -t exon -i gene_id -m intersection-nonempty); FPKM normalized by total protein-coding counts, FPKM-UQ by 75th percentile.

  - name: RPKM_saturation.py
    purpose: Assess whether transcript RPKM estimates have reached sequencing saturation.
    key_options:
      - -i/--input-file (required)
      - -o/--out-prefix (required)
      - -r/--refgene (required)
      - -d/--strand (default=None)
      - -l/--percentile-floor (default=5)
      - -u/--percentile-ceiling (default=100)
      - -s/--percentile-step (default=5)
      - -c/--rpkm-cutoff (default=0.01)
      - -q/--mapq (default=30)
      - --skip-plot (default=false)
      - --rscript (default=Rscript)
    outputs:
      - <out_prefix>.eRPKM.xls
      - <out_prefix>.saturation.r
      - <out_prefix>.pdf (via Rscript)
    external_deps: [numpy, qcmodule.SAM, Rscript]
    notes: Resamples aligned reads at increasing percentiles; boxplots of percent relative error by expression quartile; R script generated then executed.

  - name: junction_saturation.py
    purpose: Assess whether splice-junction discovery has reached sequencing saturation.
    key_options:
      - -i/--input-file (required)
      - -o/--out-prefix (required)
      - -r/--refgene (required)
      - -l/--percentile-floor (default=5)
      - -u/--percentile-ceiling (default=100)
      - -s/--percentile-step (default=5)
      - -m/--min-intron (default=50)
      - -v/--min-coverage (default=1)
      - -q/--mapq (default=30)
      - --skip-plot (default=false)
      - --rscript (default=Rscript)
    outputs:
      - <out_prefix>* (saturation tables)
      - <out_prefix>.junctionSaturation_plot.r
    external_deps: [qcmodule.SAM, Rscript]
    notes: Delegates to SAM.saturation_junction which writes tables and an R script; junctions classified as known/unknown against the BED reference.

  - name: tin.py
    purpose: Calculate transcript integrity number (TIN) per transcript or gene.
    key_options:
      - -i/--input (required)
      - -r/--refgene (required)
      - -c/--minCov (default=10)
      - -n/--sample-size (default=100)
      - -s/--subtract-background (default=false)
      - -o/--output-dir (default=".")
      - --verbose (default=false)
    outputs:
      - <stem>.tin.xls
      - <stem>.summary.txt
    external_deps: [numpy, pysam, bx.intervals.intersection, qcmodule.BED, qcmodule.getBamFiles]
    notes: BAM must be sorted and indexed; TIN 0-100 (higher = uniform coverage); TIN=0 when coverage insufficient; supports one/multiple BAM inputs.

  - name: sc_bamStat.py
    purpose: Report mapping statistics for single-cell RNA-seq BAM files.
    key_options:
      - -i/--infile (required)
      - --cb-tag (default=CB)
      - --re-tag (default=RE)
      - --tx-tag (default=TX)
      - --an-tag (default=AN)
      - --umi-tag (default=UB)
      - --xf-tag (default=xf)
      - --chrM-id (default=chrM)
      - --verbose (default=false)
    outputs:
      - stdout mapping statistics summary (via qcmodule.scbam.mapping_stat)
    external_deps: [qcmodule.scbam]
    notes: Single-cell specific; expects Cell Ranger-style tagged BAM (CB, UB, RE, TX, AN, xf); BAM index required.

  - name: sc_editMatrix.py
    purpose: Visualize error-correction edits in cellular barcodes and UMIs.
    key_options:
      - -i/--infile (required)
      - -o/--outfile (required)
      - --limit (default=None)
      - --cr-tag (default=CR)
      - --cb-tag (default=CB)
      - --ur-tag (default=UR)
      - --ub-tag (default=UB)
      - --cell-width (default=15)
      - --cell-height (default=10)
      - --font-size (default=8)
      - --angle (default=45)
      - --text-color (default=black)
      - --file-type (default=pdf)
      - --no-num (default=false)
      - --skip-heatmap (default=false)
      - --rscript (default=Rscript)
      - --install-r-deps (default=false)
      - --cran-mirror (default=https://cloud.r-project.org)
    outputs:
      - <out_file>.CB_edits_count.csv
      - <out_file>.UMI_edits_count.csv
      - <out_file>.CB_edits_heatmap.<file_type>
      - <out_file>.UMI_edits_heatmap.<file_type>
    external_deps: [qcmodule.heatmap, qcmodule.scbam, Rscript(pheatmap), shutil]
    notes: Single-cell specific; compares raw (CR/UR) vs error-corrected (CB/UB) tags; can auto-install R package pheatmap via --install-r-deps.

  - name: sc_seqLogo.py
    purpose: Generate a DNA sequence logo from FASTA, FASTQ, or sequence-only input.
    key_options:
      - -i/--infile (required)
      - -o/--outfile (required)
      - --iformat (default=fq; choices=fq|fa)
      - --oformat (default=pdf; choices=pdf|png|svg)
      - -n/--nseq-limit (default=None)
      - --font-name (default=sans)
      - --stack-order (default=big_on_top; choices=big_on_top|small_on_top|fixed)
      - --flip-below (default=false)
      - --shade-below (default=0.0)
      - --fade-below (default=0.0)
      - --exclude-N (default=false)
      - --highlight-start (default=None)
      - --highlight-end (default=None)
      - --step-size (default=10000)
      - --verbose (default=false)
    outputs:
      - <out_file>.count_matrix.csv
      - <out_file>.logo.<oformat>
    external_deps: [qcmodule.fastq]
    notes: Useful for visualizing nucleotide composition of barcodes; all sequences must be equal length; compressed input (gzip/bzip2) supported by qcmodule.fastq.

  - name: sc_seqQual.py
    purpose: Generate sequencing-quality matrices and a heatmap from a FASTQ file.
    key_options:
      - -i/--infile (required)
      - -o/--outfile (required)
      - -n/--nseq-limit (default=None)
      - --cell-width (default=12)
      - --cell-height (default=10)
      - --font-size (default=6)
      - --angle (default=45)
      - --text-color (default=black)
      - --file-type (default=pdf)
      - --no-num (default=false)
      - --skip-heatmap (default=false)
      - --rscript (default=Rscript)
      - --install-r-deps (default=false)
      - --cran-mirror (default=https://cloud.r-project.org)
    outputs:
      - <out_file>.qual_count.csv
      - <out_file>.qual_percent.csv
      - <out_file>.qual_heatmap.<file_type>
    external_deps: [qcmodule.fastq, qcmodule.heatmap, Rscript(pheatmap), shutil]
    notes: Per-cycle Phred quality count and percentage matrices; percentage matrix computed per read cycle; heatmap rendered via R pheatmap; can auto-install pheatmap.
