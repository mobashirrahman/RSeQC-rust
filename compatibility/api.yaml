            description: Group overlapping BED12 entries, static method
          - signature: complementBED(sizeFile, outfile=None)
            description: Write complement intervals using chromosome sizes
          - signature: bedToWig(outfile=None, log2scale=False, header=True)
            description: Convert BED coverage to wiggle with 1-based coords
          - signature: bedToGFF(outfile=None)
            description: Convert BED to GFF version 2 including exons
          - signature: getUTR(utr=35)
            description: Extract strand-aware UTR intervals
          - signature: getExon()
            description: Extract all exon intervals as tuples
          - signature: getTranscriptRanges()
            description: Yield chrom start end strand label per transcript
          - signature: getCDSExon()
            description: Extract CDS-clipped exon intervals
          - signature: truncate_bed(truncation_from=3, size=250)
            description: Truncate each transcript from 5-prime or 3-prime end
          - signature: getIntron()
            description: Extract introns labeled UTR3 UTR5 or CDS
          - signature: getSpliceJunctions()
            description: Yield gene plus chrom range plus junction strings
          - signature: getIntergenic(direction, size=1000)
            description: Return upstream or downstream intergenic windows
          - signature: getBedinfor(outfile=None, reffa=None)
            description: Write exon intron UTR GC summary table
          - signature: filterBedbyIntronSize(outfile=None, min_intron=50)
            description: Keep transcripts with all introns above minimum
          - signature: getAllUniqJunctions(outfile=None, flankSize=20)
            description: Write nonredundant junctions as BED12 with flanks
          - signature: collapseJunctionBed(outfile=None)
            description: Merge junctions sharing intron summing scores
          - signature: filterJunctionBed(outfile=None, overhang, min_intron, max_intron, cvg)
            description: Filter junctions by overhang intron size and coverage
          - signature: unionBED(outfile=None, outNameFile=None, boundary, stranded)
            description: Merge overlapping exons dense mode plus name map
          - signature: correctSplicingBed(genome, outfile, sp)
            description: Correct junction strand using splice motifs from genome
          - signature: nrBED(outfile=None)
            description: Merge identical structures joining gene names
      - class: CompareBED
        methods:
          - signature: annotateEvents(outfile=None)
            description: Split query junctions into known and novel files
          - signature: annotateSplicingSites(outfile=None)
            description: Split junctions by known 5-prime and 3-prime sites
          - signature: distribBed(outfile=None)
            description: Count exonic intronic spliced intergenic reads plus R pie
          - signature: distribBedWithStrand(outfile=None, output=True)
            description: Assign reads to genes strand-aware or return dict
          - signature: distribSpliceSites(outfile=None, output=True)
            description: Assign junction ends to genes strand-aware
          - signature: findClosestTSS(outfile=None, downStream, upStream)
            description: Find nearest upstream and downstream TSS per query
          - signature: findClosestTTS(outfile=None, downStream, upStream)
            description: Find nearest upstream and downstream TTS per query
          - signature: findClosestPeak(mod, downStream, upStream)
            description: Find peaks near TSS TES or CDS landmarks per gene
          - signature: bestMatch()
            description: Score exon-boundary overlap to find best reference gene
    notes: Holds open file handles and rewinds with seek after most methods. getTranscriptRanges getSpliceJunctions and tillingBed are generators. Writes output files, prints progress to stderr, calls exit on unsorted input. Uses bx bitsets and intervals plus pysam faidx. No seeded randomness.
