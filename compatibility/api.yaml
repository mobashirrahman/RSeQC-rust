  - name: BED.py
    public_symbols:
      - signature: ParseBED
        description: Manipulate single BED file with many extraction and conversion helpers
      - signature: CompareBED
        description: Compare two BED files for annotation counting and proximity
      - signature: unionBed3(lst)
        description: Union 3-column intervals via bitsets
      - signature: intersectBed3(lst1, lst2)
        description: Intersect two 3-column interval lists
      - signature: subtractBed3(lst1, lst2)
        description: Subtract second interval list from first
