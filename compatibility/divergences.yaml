# Known-divergence ledger (PORTING_PLAN.md Step 1.7).
# Every entry needs: id, command_or_api, description, classification
# (candidate-bug | upstream-bug | reference-env-failure | permitted-serialization-difference |
#  stochastic-variation | explicit-compatibility-exception), decision, status.
# Nothing here is auto-resolved; the coordinator reviews classification changes.

divergences:
  - id: DIV-0001
    command_or_api: bam_stat.py
    description: >
      Upstream's splice-read detection (qcmodule.SAM.ParseBAM.stat) calls
      bam_cigar.fetch_intron('chr1', pos, cigar) with a hardcoded 'chr1'
      placeholder chromosome name that is not actually used to detect introns
      from the CIGAR string (the chrom argument is unused in the intron-count
      decision). The Rust port checks for a CIGAR 'N' (Skip) operation
      directly instead of reusing that call shape.
    classification: permitted-serialization-difference
    decision: Port checks CIGAR Skip op directly; behavior-equivalent, not byte-equivalent to the upstream call signature (which is not observable from the CLI/output anyway).
    status: accepted

  - id: DIV-0002
    command_or_api: bam_stat.py, bam2fq.py
    description: >
      CLOSED 2026-09-17 for both commands. Their CLIs now open input via
      `rseqc_formats::open_alignments`, which dispatches on the `.bam`/
      `.sam` extension (case-insensitive) and, for `.sam` input, round-trips
      the parsed text records through an in-memory BAM byte buffer before
      handing them to the existing compute function -- which needed zero
      changes in either case. A live diff against real upstream also
      surfaced a genuine behavioral subtlety worth recording (found on
      bam_stat.py, applies identically to bam2fq.py): pysam's
      `Samfile(path, 'rb')` succeeds even for authentic plain-text SAM
      content (htslib auto-detects format and ignores the 'b' mode hint),
      so upstream's own "Load SAM file ..." branch is practically dead code
      -- upstream prints "Load BAM file ...  Done" for `.sam` input too, and
      the port now matches that exactly rather than printing a
      format-conditional message. Verified byte-identical stdout+stderr for
      both `.bam` and `.sam` input; see `verification/run_diff.py` cases
      `bam_stat_sam_text`, `bam2fq_sam_text`. bam2fq.py's migration also
      surfaced and fixed an unrelated pre-existing bug: its CLI printed a
      raw `{counts:?}` Debug dump to stderr instead of upstream's real
      "Convert BAM/SAM file into FASTQ format ...", "Done", "read count: N"
      / "read_1 count: N" + "read_2 count: N" lines.
    classification: explicit-compatibility-exception
    decision: Closed for bam_stat.py and bam2fq.py. The same `open_alignments` function is available in crates/formats for migrating the remaining candidate commands (tracked as DIV-0004).
    status: fixed-working-tree

  - id: DIV-0003
    command_or_api: package-wide
    description: >
      Upstream's own license metadata is internally inconsistent: README
      states GPL-3.0-or-later, LICENSE file contains GPLv3 text, and a
      packaging classifier says GPLv2.
    classification: upstream-bug
    decision: Resolve before choosing this project's own release license metadata (PORTING_PLAN.md Step 1.7 / Step 11.2); not yet resolved.
    status: open

  - id: DIV-0004
    command_or_api: >
      clipping_profile.py, infer_experiment.py, inner_distance.py,
      insertion_profile.py, junction_annotation.py, junction_saturation.py,
      read_distribution.py, read_duplication.py, read_GC.py, read_NVC.py,
      read_quality.py, RPKM_saturation.py
    description: >
      CLOSED 2026-09-17 -- all 12 commands migrated to
      rseqc_formats::open_alignments. A first pass at this entry
      (2026-09-17, superseded within the same day) had wrongly listed
      every command whose CLI calls `rseqc_formats::open_bam`, ~24
      commands, on the assumption that "uses open_bam" == "upstream
      advertises BAM or SAM input". That assumption was tested by
      migrating split_paired_bam.py and divide_bam.py and diffing
      against real upstream on a `.sam` fixture: BOTH commands' own
      `validate_args` explicitly reject any non-`.bam` extension via
      `parser.error` (exit code 2) BEFORE the file is ever opened --
      upstream itself is BAM-only for these two by deliberate design,
      not an unimplemented feature. Checking the full ~24-command list
      found this same explicit `.suffix.lower() != ".bam"` rejection in
      8 more: bam2wig.py, deletion_profile.py, FPKM_count.py,
      mismatch_profile.py, RNA_fragment_size.py, sc_bamStat.py,
      sc_editMatrix.py, split_bam.py (10 total, none of which belong in
      this entry -- verified BAM-only by upstream, out of scope). Two
      more, geneBody_coverage.py and tin.py, have no explicit extension
      whitelist but call `pysam.AlignmentFile(...).pileup(...)`, which
      requires genuine random-access indexed BAM -- SAM text has no
      index and could never work here either, so these are also
      excluded as a structural (not missing-feature) BAM requirement.
      The remaining 12 commands each explicitly validate
      `input_file.suffix.lower() in {".bam", ".sam", ".cram"}` in their
      own upstream source -- genuine candidates, the same class
      bam_stat.py/bam2fq.py (DIV-0002, closed) turned out to be, and all
      12 are now migrated: read_NVC.py, read_GC.py, read_duplication.py,
      read_quality.py, clipping_profile.py, insertion_profile.py,
      junction_annotation.py, junction_saturation.py, and
      RPKM_saturation.py share the identical `if self.bam_format:
      print("<Read|Load> BAM file ...") else: print("<Read|Load> SAM
      file ...")` dead-code-else pattern in their own qcmodule/SAM.py
      function, so each prints "BAM file" even for .sam input, same as
      bam_stat.py/bam2fq.py; infer_experiment.py/read_distribution.py
      have no such message at all (custom standalone scripts, not
      qcmodule.SAM methods), so their migration was a pure open_bam ->
      open_alignments swap. Note these 12 also advertise `.cram`, which
      `open_alignments` does NOT support at all (no CRAM reader in
      crates/formats) -- closing SAM-text support here does not close
      the `.cram` gap; track that remnant per-command if/when it
      matters, not as a reason to reopen this entry. See
      verification/run_diff.py cases read_NVC_sam_text, read_GC_sam_text,
      read_duplication_sam_text, read_quality_sam_text,
      infer_experiment_sam_text, read_distribution_sam_text,
      clipping_profile_sam_text, insertion_profile_sam_text,
      junction_annotation_sam_text, inner_distance_sam_text,
      junction_saturation_sam_text, rpkm_saturation_sam_text.
    classification: explicit-compatibility-exception
    decision: Closed for all 12 verified candidates. The other ~12 open_bam-using commands remain NOT part of this gap (10 are genuinely BAM-only by upstream's own argparse validation; geneBody_coverage.py/tin.py require indexed random access that SAM text structurally cannot provide) -- do not re-add them here without re-deriving from upstream source first.
    status: fixed-working-tree

  - id: DIV-0005
    command_or_api: >
      All 14 upstream commands with a --skip-plot/--rscript R-plotting
      contract (formerly: clipping_profile.py, deletion_profile.py,
      insertion_profile.py, mismatch_profile.py, read_duplication.py,
      read_GC.py, read_quality.py)
    description: >
      This entry originally described a much broader gap ("native plot
      rendering and R-script generation has not been started for any
      command") that was found to be stale 2026-09-17 and, after fixing
      each remaining case individually, is now CLOSED. All 14 upstream
      commands with a `--skip-plot`/`--rscript` R-plotting contract
      (`geneBody_coverage.py`, `geneBody_coverage2.py`,
      `RPKM_saturation.py`, `inner_distance.py`, `junction_annotation.py`,
      `junction_saturation.py`, `read_NVC.py`, `clipping_profile.py`,
      `deletion_profile.py`, `insertion_profile.py`,
      `mismatch_profile.py`, `read_duplication.py`, `read_GC.py`,
      `read_quality.py`) now generate correct R-script text, accept
      `--skip-plot`/`--rscript`, and actually invoke `Rscript` when not
      skipped -- verified with REAL Rscript execution (Rscript 4.3.3 is
      present in this sandbox), not just `--skip-plot`, confirming a
      valid PDF is produced on every one of them. Several genuine bugs
      were found and fixed along the way, not just the missing
      subprocess wiring: invented, non-upstream console messages in
      `read_NVC.py`/`read_GC.py`/`read_quality.py`/`read_duplication.py`
      /`clipping_profile.py`/`insertion_profile.py` (replaced with
      upstream's real text, including literal upstream typos like
      "Totoal reads used" -- preserved, not "fixed"); a wrong quote
      style in `read_duplication.py`'s `pdf(...)` R-code line (double
      quotes instead of upstream's actual single quotes, found only via
      a live diff, not by re-deriving from source); a missing
      3-empty-files-then-exit behavior in `inner_distance.py`'s
      zero-pairs path. `crates/render` (native, non-R plotting) still
      does NOT exist at all -- that remains a SEPARATE, unrelated gap
      (relevant chiefly to DIV-0016's `sc_seqLogo.py`, whose upstream
      plotting mechanism is Python's `logomaker` library, not R, so it
      has no R-script fallback to begin with).
    classification: explicit-compatibility-exception
    decision: >
      Fixed in the working tree 2026-09-17 (commits `687fd0c`, `89e17f9`,
      `a834f5c`, and the one closing this entry). Plotting is required
      for full compatibility per PORTING_PLAN.md Step 6 ("no
      TODO:plotting command is counted as finished") -- this requirement
      is now met for every command whose upstream plotting mechanism is
      R-based. `crates/render` (native plotting) remains a distinct,
      open item tracked separately (see DIV-0016 and PORTING_PLAN.md
      Step 6's broader native-rendering scope, not this entry).
    status: fixed-working-tree

  - id: DIV-0006
    command_or_api: split_paired_bam.py, divide_bam.py
    description: >
      Upstream optionally creates a .bai index for each output BAM
      (split_paired_bam.py's --index-output, divide_bam.py's --index). Not
      implemented in the Rust port yet.
    classification: explicit-compatibility-exception
    decision: Disclosed follow-up; BAM index writing needs its own format-library evaluation, not yet done.
    status: open

  - id: DIV-0007
    command_or_api: bam2fq.py
    description: >
      CLOSED 2026-09-17. `-c/--compress` gzips each output FASTQ file
      after writing, via the `flate2` crate at compression level 9
      (matches Python's `gzip.open` default `compresslevel`). Verified
      via live diff: stderr's "Compressing <path> ..."/"Compression
      complete." lines match exactly, and the DECOMPRESSED content of
      both sides' .gz output is byte-identical (see
      verification/run_diff.py case bam2fq_compress). The .gz
      CONTAINER's own bytes are not, and cannot be, byte-identical
      between the two sides: Python's `gzip.open(path, 'wb')` stamps the
      current wall-clock time into the gzip header on every run, so even
      two runs of the real upstream CLI never produce identical .gz
      bytes for the same input -- this is not a divergence to fix, just
      an inherent property of the format upstream itself has.
    classification: explicit-compatibility-exception
    decision: Closed. Compressed FASTQ/FASTA INPUT (a separate, still-open gap for sc_seqQual.py/sc_seqLogo.py, not covered by this entry) can reuse the same flate2 dependency once undertaken.
    status: fixed-working-tree

  - id: DIV-0008
    command_or_api: read_NVC.py
    description: >
      Upstream's readsNVC() data table has as many rows as the LENGTH OF THE
      LAST RECORD PROCESSED in file order (the `RNA_read` variable retains
      its final loop-iteration value after the read loop exits), not the
      maximum read length seen across the file. If the last record is
      shorter than earlier records, the table is silently truncated to that
      shorter length -- almost certainly an unintentional upstream bug, but
      it is directly observable in the output file's row count.
    classification: upstream-bug
    decision: Preserved exactly in the Rust port (compatibility mode) rather than silently "fixed" to use max length, per PORTING_PLAN.md Step 1.7 ("do not silently 'correct' an algorithm in compatibility mode"). A corrected behavior may be offered later as an explicit separate mode.
    status: accepted

  - id: DIV-0009
    command_or_api: read_quality.py
    description: >
      Same pattern as DIV-0008: upstream's readsQual_boxplot() iterates
      `range(0, read_len)` to build the output R script, where `read_len` is
      whatever the LAST processed record's length happened to be, not the
      max across the file.
    classification: upstream-bug
    decision: Preserved exactly, same rationale as DIV-0008.
    status: accepted

  - id: DIV-0010
    command_or_api: clipping_profile.py
    description: >
      Same last-record-length pattern as DIV-0008/DIV-0009, one further
      twist: upstream's `read_pos = list(range(0,len(cigar_str)))` uses
      whichever record's expanded CIGAR string was computed LAST among all
      records that pass the mapq/unmapped/qc-fail (and, in paired mode,
      is_paired) filters -- including records that end up contributing
      nothing to the histogram because they have no clip/insertion
      operation at all (the `if type not in cigar_str: continue` skip
      happens after `cigar_str` is (re)assigned each iteration).
    classification: upstream-bug
    decision: Preserved exactly, same rationale as DIV-0008.
    status: accepted

  - id: DIV-0011
    command_or_api: tin.py
    description: >
      Upstream's genebody_coverage() calls pysam.AlignmentFile.pileup()
      with no explicit flag_filter/min_base_quality/ignore_overlaps
      arguments, so pysam's own defaults silently apply:
      flag_filter=BAM_FUNMAP|BAM_FSECONDARY|BAM_FQCFAIL|BAM_FDUP (excludes
      duplicate-flagged reads from coverage, unlike check_min_reads/
      estimate_bg_noise which use fetch() with no such filter and so DO
      count duplicates -- a real asymmetry, replicated in the Rust port);
      min_base_quality=13 (bases below phred 13 excluded from coverage --
      replicated); and ignore_overlaps=True (overlapping paired-end mates
      at a shared reference position are deduplicated, counting only the
      higher-quality base once -- now replicated in the Rust port by
      template-name grouping). The default max_depth=8000 is also enforced
      per pileup column. Also, query_length used by
      estimate_bg_noise is taken from the read's SEQ length rather than
      reproducing pysam's CIGAR-based inference fallback for a missing SEQ
      ("*"), a case expected to be rare in practice.
    classification: unimplemented-pysam-default
    decision: >
      flag_filter, min_base_quality, max_depth, and ignore_overlaps are now
      implemented in the working tree and covered by deterministic oracle
      regressions. The implementation groups paired pileup bases by QNAME and
      retains the higher-quality base. This closes the reproduced overlap and
      depth mismatches for the tested profile, but malformed pairing, unusual
      QNAME reuse, and exact htslib admission order remain outside the current
      tiny fixture; retain this item for independent real-data review.
    status: fixed-working-tree

  - id: DIV-0012
    command_or_api: RPKM_saturation.py
    description: >
      Upstream's saturation_RPKM re-opens and re-parses the reference
      BED12 gene model file from scratch on every iteration of the outer
      percentile-sampling loop (once per entry in `tmp`, typically ~20
      times at the default -l5/-u100/-s5 settings). Any malformed line's
      "[NOTE:input bed must be 12-column] skipped this line: ..." stderr
      warning is therefore printed once per percentile iteration, not
      once overall. The Rust port parses the gene model exactly once
      (`parse_gene_model`) and reuses the resulting `Vec<TranscriptExons>`
      across all percentiles, since the file's content and the parse
      outcome cannot change between iterations.
    classification: acceptable-simplification
    decision: >
      Preserving the literal re-parse-per-iteration behavior would only
      reproduce duplicated stderr diagnostic noise for malformed input
      lines; it has no effect on any computed output (.eRPKM.xls,
      .rawCount.xls, or the R script). Parsing once is strictly better
      and does not change program behavior observable in output files.
    status: accepted

  - id: DIV-0013
    command_or_api: RPKM_saturation.py
    description: >
      Upstream's show_saturation() writes the `pdf(...)` and
      `par(mfrow=c(2,2))` lines to the `.saturation.r` file BEFORE
      computing `plot_headers = header[:-1]` inside the first quantile
      iteration; if `plot_headers` turns out to be empty (fewer than two
      sampling percentiles), it raises ValueError mid-write, leaving a
      truncated two-line R script on disk. The Rust port
      (render_saturation_r_script) checks this condition up front and
      returns an error before writing anything, so no partial file is
      produced.
    classification: acceptable-simplification
    decision: >
      A truncated, unusable R script is not a meaningful artifact to
      reproduce byte-for-byte; both implementations fail the command with
      a hard error in this case (an edge case requiring
      --percentile-step >= --percentile-ceiling - --percentile-floor).
      Not writing a broken partial file is strictly better behavior.
    status: accepted

  - id: DIV-0014
    command_or_api: geneBody_coverage2.py
    description: >
      The "skip transcripts shorter than 100bp" check in
      coverage_gene_body_bigwig() is misplaced INSIDE the per-exon
      accumulation loop (checked and breaking immediately after each
      exon is added) rather than after the full loop completes (contrast
      geneBody_coverage.py's sibling function, which checks the total
      length only once, after accumulating every exon). Because the
      running total only ever grows, a multi-exon transcript is skipped
      entirely unless its FIRST exon alone already has >=100 bases, even
      if the full spliced transcript is well over 100bp. Most real
      multi-exon transcripts with small individual exons therefore fail
      this filter and are silently excluded, regardless of total mRNA
      length.
    classification: upstream-bug
    decision: >
      Preserved exactly, same rationale as DIV-0008/DIV-0009/DIV-0010:
      this project replicates upstream algorithmic behavior faithfully,
      including bugs, and documents them here rather than silently
      "fixing" them.
    status: accepted

  - id: DIV-0015
    command_or_api: overlay_bigwig.py
    description: >
      The '-a Division' action is uncallable under Python 3.
      qcmodule.twoList.Division computes `(v1+1).__div__(v2+1)`, and
      `__div__` is a Python-2-only ndarray dunder method that numpy does
      not implement under Python 3 (only `__truediv__`/`__floordiv__`
      exist) -- calling it always raises an uncaught AttributeError,
      crashing the program with a traceback. This is not caught by the
      CLI's own `except (OSError, ValueError, RuntimeError)` clause
      (AttributeError is none of those). Confirmed by directly importing
      and calling qcmodule.twoList.Division in oracle/venv.
    classification: upstream-bug
    decision: >
      Preserved as dead/uncallable functionality: the Rust port's
      '-a Division' returns an immediate hard error rather than either
      implementing a working division (which upstream cannot actually
      perform today) or silently succeeding. Same rationale as
      DIV-0008/DIV-0009/DIV-0010/DIV-0014 -- replicate upstream behavior
      faithfully, including confirmed bugs, and disclose them here
      rather than silently "fixing" them into different (better)
      behavior than upstream actually has.
    status: accepted

  - id: DIV-0016
    command_or_api: sc_seqLogo.py
    description: >
      Upstream's sequence-logo image (.logo.<format>) is rendered by
      qcmodule.fastq.make_logo, which calls the Python logomaker library
      directly (matplotlib-based), not R. Every other "plot" command in
      this port defers native rendering under DIV-0005 while still
      producing a complete, real artifact -- literal R-script text that
      would generate the plot if Rscript were run against it. This
      command has no such escape hatch: there is no R-script
      intermediate for a logomaker-rendered plot. The .count_matrix.csv
      output (a real, correct, independently useful deliverable) IS
      fully computed and written; the .logo.<format> image is NOT
      produced by this port at all.
    classification: unimplemented-native-rendering
    decision: >
      Same underlying gap as DIV-0005 (crates/render not started), but
      called out separately because, unlike every other DIV-0005 case,
      there is no partial/deferred artifact for this specific output --
      only a disclosed absence. Implement crates/render before this
      command can be considered complete.
    status: accepted

  - id: DIV-0017
    command_or_api: divide_bam.py
    description: >
      Upstream seeds Python's `random.Random(seed)` and calls
      `rng.randrange(n)` once per distinct query name to assign it to an
      output file. The Rust port seeds `rand::rngs::StdRng::seed_from_u64`
      and calls `rng.gen_range(0..n)`. Both are deterministic given the
      same seed (same-language, same-run reproducibility is preserved),
      but the two RNG algorithms and their stream-to-integer mappings are
      different implementations, so `--seed N` does NOT assign the same
      query names to the same output-file indices across the Python and
      Rust builds -- only within one implementation across repeated runs.
    classification: permitted-serialization-difference
    decision: >
      Cross-language bit-for-bit RNG stream reproduction is out of scope
      (no user-facing contract depends on the assignment itself, only on
      "paired mates stay together" and "roughly equal subset sizes",
      both of which hold in either implementation). Not planned for
      closure.
    status: accepted

  - id: DIV-0018
    command_or_api: sc_bamStat.py
    description: >
      Upstream's `qcmodule.scbam.mapping_stat` writes per-chromosome
      intermediate files (`<chrom>.all_reads_id.txt`/
      `<chrom>.confident_reads_id.txt`) into the CURRENT WORKING
      DIRECTORY (fixed names, not scoped to any output prefix or flag),
      shells out to `awk '!a[$0]++' *.all_reads_id.txt | tee
      All_reads_uniqID.txt | wc -l` (and the confident-reads equivalent)
      to deduplicate read IDs and count them, deletes the per-chromosome
      temp files afterward, but LEAVES `All_reads_uniqID.txt`/
      `confident_reads_uniqID.txt` behind permanently in whatever
      directory the command was invoked from. The Rust port computes the
      identical counts directly via an in-memory `HashSet<String>` (see
      crates/commands/src/sc_bamstat.rs module docs) and does not shell
      out to `awk`/`wc`/`tee` or write ANY of these intermediate/leftover
      files -- the printed stdout report (the actual data output) is
      unaffected and verified byte-identical.
    classification: explicit-compatibility-exception
    decision: >
      Deliberately not replicated. This is fixed-name, unscoped CWD
      pollution with no `-o`/prefix control in upstream's own CLI --
      blindly reproducing it would risk silently clobbering an existing
      file of the same name in whatever directory the Rust binary is
      invoked from, for no benefit (nothing downstream in the standard
      workflow consumes these files; they exist only as an artifact of
      upstream's `awk`-based dedup-counting implementation detail, not a
      documented output of the command). If a real consumer is found
      that depends on these specific files, revisit.
    status: accepted

  - id: DIV-0019
    command_or_api: sc_bamStat.py
    description: >
      Upstream configures Python's `logging` module at INFO level
      (unconditionally -- `--verbose` only raises it to DEBUG, it is NOT
      required for INFO output) and emits a full per-chromosome progress
      trail: "Reading BAM file ... ", one "Processing \"<chrom>\" ..." /
      "Processed N alignments from \"<chrom>\"" pair per chromosome in
      the BAM header (even chromosomes with zero alignments -- the loop
      iterates `samfile.references` unconditionally), "Processing total
      N alignments ...", "Count total/confidently mapped reads ...",
      "Removing intermediate files ...", "Done." -- each line prefixed
      with a `%(asctime)s [%(levelname)s]` timestamp.
    classification: explicit-compatibility-exception
    decision: >
      CLOSED (content-complete) as of 2026-09-17: `mapping_stat` in
      crates/commands/src/sc_bamstat.rs was restructured to group its
      single streaming pass by consecutive `reference_sequence_id` runs
      (assuming coordinate-sorted input, same assumption upstream's own
      `require_index` already implies) and now emits every one of the
      lines above, in the same order, with the same content -- verified
      via a live diff against the real upstream CLI (every line matched
      after stripping the timestamp+level prefix; stdout, the actual
      data report, was already and remains byte-identical). Restructuring
      this way also fixed a latent, previously-undetected exclusion bug:
      upstream's per-chromosome `samfile.fetch(chr_id)` never visits a
      read whose reference doesn't resolve to any header chromosome (a
      truly unmapped read with no RNAME), silently excluding it from
      EVERY count -- the port's old flat sequential scan counted such
      reads, a real (if likely rare in practice) divergence, now fixed
      by the same restructuring. NOT reclassified to "accepted": the
      `%(asctime)s [%(levelname)s]` timestamp prefix still makes
      byte-exact stderr comparison impossible in principle, so this can
      never be a `run_diff.py` exact-stream-comparison target the way
      other commands' progress lines are -- that specific formatting
      gap remains, by design, not by omission.
    status: accepted
