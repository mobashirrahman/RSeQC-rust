# Known-divergence ledger (PORTING_PLAN.md Step 1.7).
# Every entry needs: id, command_or_api, description, classification
# (candidate-bug | upstream-bug | reference-env-failure | permitted-serialization-difference |
#  stochastic-variation | explicit-compatibility-exception), decision, status.
# Nothing here is auto-resolved; the coordinator reviews classification changes.

divergences:
  - id: DIV-0001
    command_or_api: bam_stat.py
    description: >
      Upstream's splice-read detection (qcmodule.SAM.ParseBAM.stat) calls
      bam_cigar.fetch_intron('chr1', pos, cigar) with a hardcoded 'chr1'
      placeholder chromosome name that is not actually used to detect introns
      from the CIGAR string (the chrom argument is unused in the intron-count
      decision). The Rust port checks for a CIGAR 'N' (Skip) operation
      directly instead of reusing that call shape.
    classification: permitted-serialization-difference
    decision: Port checks CIGAR Skip op directly; behavior-equivalent, not byte-equivalent to the upstream call signature (which is not observable from the CLI/output anyway).
    status: accepted

  - id: DIV-0002
    command_or_api: bam_stat.py
    description: >
      Vertical-slice Rust port (Step 5) supports BAM input only. Upstream's
      help text advertises "BAM or SAM" (plain-text SAM input via pysam).
    classification: explicit-compatibility-exception
    decision: SAM-text input is a disclosed gap until a follow-up task adds it; do not claim full bam_stat.py compatibility until closed.
    status: open

  - id: DIV-0003
    command_or_api: package-wide
    description: >
      Upstream's own license metadata is internally inconsistent: README
      states GPL-3.0-or-later, LICENSE file contains GPLv3 text, and a
      packaging classifier says GPLv2.
    classification: upstream-bug
    decision: Resolve before choosing this project's own release license metadata (PORTING_PLAN.md Step 1.7 / Step 11.2); not yet resolved.
    status: open

  - id: DIV-0004
    command_or_api: bam_stat.py, split_paired_bam.py, bam2fq.py, divide_bam.py
    description: >
      All four commands ported so far are BAM-only; upstream's help text for
      each advertises "BAM or SAM" (plain-text SAM input via pysam).
    classification: explicit-compatibility-exception
    decision: SAM-text input is a disclosed gap across all ported commands until a follow-up adds a shared SAM-text reader in crates/formats; do not claim full compatibility for any of them until closed.
    status: open

  - id: DIV-0005
    command_or_api: read_NVC.py and other plotting commands
    description: >
      Native plot rendering and R-script generation (crates/render) has not
      been started. Commands that upstream pairs with an R plot (e.g.
      read_NVC.py's .NVC_plot.r / .NVC_plot.pdf) currently produce only the
      underlying data table.
    classification: explicit-compatibility-exception
    decision: Plotting is required for full compatibility per PORTING_PLAN.md Step 6 ("no TODO:plotting command is counted as finished") -- ported commands with a data-only Rust implementation are NOT yet complete ports, just usable data-generation slices, until crates/render exists and is wired in.
    status: open

  - id: DIV-0006
    command_or_api: split_paired_bam.py, divide_bam.py
    description: >
      Upstream optionally creates a .bai index for each output BAM
      (split_paired_bam.py's --index-output, divide_bam.py's --index). Not
      implemented in the Rust port yet.
    classification: explicit-compatibility-exception
    decision: Disclosed follow-up; BAM index writing needs its own format-library evaluation, not yet done.
    status: open

  - id: DIV-0007
    command_or_api: bam2fq.py
    description: >
      Upstream's -c/--compress flag gzips the output FASTQ file(s) after
      writing. Not implemented in the Rust port yet.
    classification: explicit-compatibility-exception
    decision: Disclosed follow-up (likely via the `flate2` crate); not a scientific-correctness gap, low priority.
    status: open

  - id: DIV-0008
    command_or_api: read_NVC.py
    description: >
      Upstream's readsNVC() data table has as many rows as the LENGTH OF THE
      LAST RECORD PROCESSED in file order (the `RNA_read` variable retains
      its final loop-iteration value after the read loop exits), not the
      maximum read length seen across the file. If the last record is
      shorter than earlier records, the table is silently truncated to that
      shorter length -- almost certainly an unintentional upstream bug, but
      it is directly observable in the output file's row count.
    classification: upstream-bug
    decision: Preserved exactly in the Rust port (compatibility mode) rather than silently "fixed" to use max length, per PORTING_PLAN.md Step 1.7 ("do not silently 'correct' an algorithm in compatibility mode"). A corrected behavior may be offered later as an explicit separate mode.
    status: accepted

  - id: DIV-0009
    command_or_api: read_quality.py
    description: >
      Same pattern as DIV-0008: upstream's readsQual_boxplot() iterates
      `range(0, read_len)` to build the output R script, where `read_len` is
      whatever the LAST processed record's length happened to be, not the
      max across the file.
    classification: upstream-bug
    decision: Preserved exactly, same rationale as DIV-0008.
    status: accepted

  - id: DIV-0010
    command_or_api: clipping_profile.py
    description: >
      Same last-record-length pattern as DIV-0008/DIV-0009, one further
      twist: upstream's `read_pos = list(range(0,len(cigar_str)))` uses
      whichever record's expanded CIGAR string was computed LAST among all
      records that pass the mapq/unmapped/qc-fail (and, in paired mode,
      is_paired) filters -- including records that end up contributing
      nothing to the histogram because they have no clip/insertion
      operation at all (the `if type not in cigar_str: continue` skip
      happens after `cigar_str` is (re)assigned each iteration).
    classification: upstream-bug
    decision: Preserved exactly, same rationale as DIV-0008.
    status: accepted
