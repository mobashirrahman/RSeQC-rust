# Known-divergence ledger (PORTING_PLAN.md Step 1.7).
# Every entry needs: id, command_or_api, description, classification
# (candidate-bug | upstream-bug | reference-env-failure | permitted-serialization-difference |
#  stochastic-variation | explicit-compatibility-exception), decision, status.
# Nothing here is auto-resolved; the coordinator reviews classification changes.

divergences:
  - id: DIV-0001
    command_or_api: bam_stat.py
    description: >
      Upstream's splice-read detection (qcmodule.SAM.ParseBAM.stat) calls
      bam_cigar.fetch_intron('chr1', pos, cigar) with a hardcoded 'chr1'
      placeholder chromosome name that is not actually used to detect introns
      from the CIGAR string (the chrom argument is unused in the intron-count
      decision). The Rust port checks for a CIGAR 'N' (Skip) operation
      directly instead of reusing that call shape.
    classification: permitted-serialization-difference
    decision: Port checks CIGAR Skip op directly; behavior-equivalent, not byte-equivalent to the upstream call signature (which is not observable from the CLI/output anyway).
    status: accepted

  - id: DIV-0002
    command_or_api: bam_stat.py, bam2fq.py
    description: >
      CLOSED 2026-09-17 for both commands. Their CLIs now open input via
      `rseqc_formats::open_alignments`, which dispatches on the `.bam`/
      `.sam`/`.cram` extension (case-insensitive) and, for `.sam`/`.cram`
      input, round-trips the parsed records through an in-memory BAM byte
      buffer before handing them to the existing compute function -- which
      needed zero changes in any case. Neither command has its own
      extension whitelist upstream (unlike the 12 DIV-0004 commands), so
      `.cram` support here is a side effect of sharing `open_alignments`,
      not something separately verified for these two specifically -- see
      DIV-0004 for the CRAM verification evidence (read_NVC_cram case and
      the htslib/noodles-cram MAPQ interop fix). A live diff against real
      upstream also
      surfaced a genuine behavioral subtlety worth recording (found on
      bam_stat.py, applies identically to bam2fq.py): pysam's
      `Samfile(path, 'rb')` succeeds even for authentic plain-text SAM
      content (htslib auto-detects format and ignores the 'b' mode hint),
      so upstream's own "Load SAM file ..." branch is practically dead code
      -- upstream prints "Load BAM file ...  Done" for `.sam` input too, and
      the port now matches that exactly rather than printing a
      format-conditional message. Verified byte-identical stdout+stderr for
      both `.bam` and `.sam` input; see `verification/run_diff.py` cases
      `bam_stat_sam_text`, `bam2fq_sam_text`. bam2fq.py's migration also
      surfaced and fixed an unrelated pre-existing bug: its CLI printed a
      raw `{counts:?}` Debug dump to stderr instead of upstream's real
      "Convert BAM/SAM file into FASTQ format ...", "Done", "read count: N"
      / "read_1 count: N" + "read_2 count: N" lines.
    classification: explicit-compatibility-exception
    decision: Closed for bam_stat.py and bam2fq.py. The same `open_alignments` function is available in crates/formats for migrating the remaining candidate commands (tracked as DIV-0004).
    status: fixed-working-tree

  - id: DIV-0003
    command_or_api: package-wide
    description: >
      Upstream's own license metadata is internally inconsistent: README
      states GPL-3.0-or-later, LICENSE file contains GPLv3 text, and a
      packaging classifier says GPLv2.
    classification: upstream-bug
    decision: >
      Resolved. This project's own release license is GPL-3.0-or-later, chosen
      by the maintainer on 2026-10-01, and a root LICENSE file now carries the
      canonical GPLv3 text fetched from gnu.org (sha256 3972dc97..., 674 lines,
      all 17 sections present).
      "or-later" is consistent with the text itself: GPLv3 section 14
      explicitly permits a program to be licensed under a later version, so a
      bare GPLv3 text file is not in tension with a GPL-3.0-or-later
      declaration. The upstream inconsistency is recorded here and NOT carried
      into this project's metadata: Cargo.toml and CITATION.cff both say
      GPL-3.0-or-later, with no GPLv2 classifier anywhere, because the
      classifier is the outlier of the three.
      The upstream discrepancy is preserved for packaging fidelity under
      DIV-0004's file-level rules; it is not a defect this port reproduces.
    status: accepted

  - id: DIV-0004
    command_or_api: >
      clipping_profile.py, infer_experiment.py, inner_distance.py,
      insertion_profile.py, junction_annotation.py, junction_saturation.py,
      read_distribution.py, read_duplication.py, read_GC.py, read_NVC.py,
      read_quality.py, RPKM_saturation.py
    description: >
      CLOSED 2026-09-17 -- all 12 commands migrated to
      rseqc_formats::open_alignments. A first pass at this entry
      (2026-09-17, superseded within the same day) had wrongly listed
      every command whose CLI calls `rseqc_formats::open_bam`, ~24
      commands, on the assumption that "uses open_bam" == "upstream
      advertises BAM or SAM input". That assumption was tested by
      migrating split_paired_bam.py and divide_bam.py and diffing
      against real upstream on a `.sam` fixture: BOTH commands' own
      `validate_args` explicitly reject any non-`.bam` extension via
      `parser.error` (exit code 2) BEFORE the file is ever opened --
      upstream itself is BAM-only for these two by deliberate design,
      not an unimplemented feature. Checking the full ~24-command list
      found this same explicit `.suffix.lower() != ".bam"` rejection in
      8 more: bam2wig.py, deletion_profile.py, FPKM_count.py,
      mismatch_profile.py, RNA_fragment_size.py, sc_bamStat.py,
      sc_editMatrix.py, split_bam.py (10 total, none of which belong in
      this entry -- verified BAM-only by upstream, out of scope). Two
      more, geneBody_coverage.py and tin.py, have no explicit extension
      whitelist but call `pysam.AlignmentFile(...).pileup(...)`, which
      requires genuine random-access indexed BAM -- SAM text has no
      index and could never work here either, so these are also
      excluded as a structural (not missing-feature) BAM requirement.
      The remaining 12 commands each explicitly validate
      `input_file.suffix.lower() in {".bam", ".sam", ".cram"}` in their
      own upstream source -- genuine candidates, the same class
      bam_stat.py/bam2fq.py (DIV-0002, closed) turned out to be, and all
      12 are now migrated: read_NVC.py, read_GC.py, read_duplication.py,
      read_quality.py, clipping_profile.py, insertion_profile.py,
      junction_annotation.py, junction_saturation.py, and
      RPKM_saturation.py share the identical `if self.bam_format:
      print("<Read|Load> BAM file ...") else: print("<Read|Load> SAM
      file ...")` dead-code-else pattern in their own qcmodule/SAM.py
      function, so each prints "BAM file" even for .sam input, same as
      bam_stat.py/bam2fq.py; infer_experiment.py/read_distribution.py
      have no such message at all (custom standalone scripts, not
      qcmodule.SAM methods), so their migration was a pure open_bam ->
      open_alignments swap. These 12 also advertise `.cram`, which is
      NOW ALSO supported (2026-09-17): `open_alignments` gained a CRAM
      branch (decodes with noodles_cram's default, empty reference-
      sequence repository -- correctly handles embedded/no-reference
      CRAM, which is what pysam/htslib themselves fall back to when
      writing CRAM without an explicit external reference; a CRAM file
      genuinely requiring EXTERNAL reference resolution will error
      instead of silently producing wrong data, and network-based
      reference auto-fetch -- which htslib itself can fall back to --
      is deliberately not replicated, out of keeping with this
      project's offline-first design). Verified via live diff on
      read_NVC.py against a real CRAM fixture (bam_stat_basic.cram, the
      same alignments as bam_stat_basic.bam re-encoded as CRAM), which
      caught a genuine htslib/noodles-cram interop discrepancy: an
      unmapped read's explicit MAPQ 0 does not survive htslib's own
      CRAM write/read round-trip faithfully (htslib's CRAM writer
      re-encodes unmapped reads' MAPQ as "missing" regardless of the
      original value, and htslib's own CRAM reader then reports 0 as a
      read-time convenience default for that specific "missing"
      condition -- an asymmetry `noodles_cram`, which faithfully
      reports what's actually stored, does not replicate). Fixed by
      reproducing htslib's specific read-time convention in
      `rseqc_formats::fix_unmapped_missing_mapping_quality` (only for
      unmapped reads with a missing MAPQ from CRAM specifically, not a
      general "missing MAPQ" rule) -- see that function's own doc
      comment for the full account. See verification/run_diff.py cases
      read_NVC_sam_text, read_GC_sam_text, read_duplication_sam_text,
      read_quality_sam_text, infer_experiment_sam_text,
      read_distribution_sam_text, clipping_profile_sam_text,
      insertion_profile_sam_text, junction_annotation_sam_text,
      inner_distance_sam_text, junction_saturation_sam_text,
      rpkm_saturation_sam_text, and read_NVC_cram for the CRAM path
      specifically (only one command's CRAM path has a dedicated case
      so far -- the round-trip mechanism is shared and already proven
      for SAM-text on all 12, so this is lower incremental risk than
      it might look, but per-command CRAM cases are still a reasonable
      future coverage-expansion target, same reasoning as any other
      "add more run_diff.py cases" item).
    classification: explicit-compatibility-exception
    decision: Closed for all 12 verified candidates. The other ~12 open_bam-using commands remain NOT part of this gap (10 are genuinely BAM-only by upstream's own argparse validation; geneBody_coverage.py/tin.py require indexed random access that SAM text structurally cannot provide) -- do not re-add them here without re-deriving from upstream source first.
    status: fixed-working-tree

  - id: DIV-0005
    command_or_api: >
      All 14 upstream commands with a --skip-plot/--rscript R-plotting
      contract (formerly: clipping_profile.py, deletion_profile.py,
      insertion_profile.py, mismatch_profile.py, read_duplication.py,
      read_GC.py, read_quality.py)
    description: >
      This entry originally described a much broader gap ("native plot
      rendering and R-script generation has not been started for any
      command") that was found to be stale 2026-09-17 and, after fixing
      each remaining case individually, is now CLOSED. All 14 upstream
      commands with a `--skip-plot`/`--rscript` R-plotting contract
      (`geneBody_coverage.py`, `geneBody_coverage2.py`,
      `RPKM_saturation.py`, `inner_distance.py`, `junction_annotation.py`,
      `junction_saturation.py`, `read_NVC.py`, `clipping_profile.py`,
      `deletion_profile.py`, `insertion_profile.py`,
      `mismatch_profile.py`, `read_duplication.py`, `read_GC.py`,
      `read_quality.py`) now generate correct R-script text, accept
      `--skip-plot`/`--rscript`, and actually invoke `Rscript` when not
      skipped -- verified with REAL Rscript execution (Rscript 4.3.3 is
      present in this sandbox), not just `--skip-plot`, confirming a
      valid PDF is produced on every one of them. Several genuine bugs
      were found and fixed along the way, not just the missing
      subprocess wiring: invented, non-upstream console messages in
      `read_NVC.py`/`read_GC.py`/`read_quality.py`/`read_duplication.py`
      /`clipping_profile.py`/`insertion_profile.py` (replaced with
      upstream's real text, including literal upstream typos like
      "Totoal reads used" -- preserved, not "fixed"); a wrong quote
      style in `read_duplication.py`'s `pdf(...)` R-code line (double
      quotes instead of upstream's actual single quotes, found only via
      a live diff, not by re-deriving from source); a missing
      3-empty-files-then-exit behavior in `inner_distance.py`'s
      zero-pairs path. `crates/render` (native, non-R plotting) still
      does NOT exist at all -- that remains a SEPARATE, unrelated gap
      (relevant chiefly to DIV-0016's `sc_seqLogo.py`, whose upstream
      plotting mechanism is Python's `logomaker` library, not R, so it
      has no R-script fallback to begin with).
    classification: explicit-compatibility-exception
    decision: >
      Fixed in the working tree 2026-09-17 (commits `687fd0c`, `89e17f9`,
      `a834f5c`, and the one closing this entry). Plotting is required
      for full compatibility per PORTING_PLAN.md Step 6 ("no
      TODO:plotting command is counted as finished") -- this requirement
      is now met for every command whose upstream plotting mechanism is
      R-based. `crates/render` (native plotting) remains a distinct,
      open item tracked separately (see DIV-0016 and PORTING_PLAN.md
      Step 6's broader native-rendering scope, not this entry).
    status: fixed-working-tree

  - id: DIV-0006
    command_or_api: split_paired_bam.py, divide_bam.py, split_bam.py
    description: >
      CLOSED 2026-09-17 (with a documented sub-caveat for
      split_paired_bam.py and split_bam.py, see below). All three
      commands now write a real `.bai` index for each output BAM via a
      shared `rseqc_formats::write_bai_index` (uses noodles_bam::fs::index
      + noodles_bam::bai::fs::write). The `.bai` CONTAINER bytes are never
      identical to htslib's own output (different binning-index encoder
      implementation detail) -- verified instead by reading the Rust-
      produced index back with real pysam (`AlignmentFile(...).fetch()`)
      and confirming it correctly answers indexed queries, plus two new
      crates/formats unit tests (round-trips a real index, and confirms
      a non-coordinate-sorted header is rejected the same way pysam/
      htslib would reject it).

      divide_bam.py's `--index` closes cleanly with a genuine live diff
      against real upstream (verification/run_diff.py case
      divide_bam_index): both sides produce a working index, stderr
      matches exactly, `.bai` presence/size is checked via the new
      `expect_files` Case field (not byte comparison, for the reason
      above).

      split_paired_bam.py's `--index-output` AND split_bam.py's
      `--index-output` have NO working live-diff counterpart: both
      upstream scripts' `index_bam()` helper calls
      `pysam.index("-f", str(path))` (evidently copy-pasted between the
      two scripts), and `-f` is not a valid `samtools index` option in
      any samtools/htslib version (it has never had a force/overwrite
      flag for this subcommand) -- so `--index-output` crashes on EVERY
      invocation of both real upstream CLIs in this sandbox with
      "index: invalid option -- 'f'" / "could not index ...; the output
      BAM may not be coordinate-sorted" regardless of input data. This
      looks like a genuine upstream typo/bug (perhaps confused with a
      different tool's `-f` flag), not an intentional behavior worth
      replicating -- reproducing a universal crash would make the whole
      flag permanently non-functional in this port for no benefit. This
      port instead implements the working, intended behavior and
      discloses the upstream crash here rather than silently diverging.
      split_bam.py's migration also fixed two unrelated pre-existing
      bugs found along the way: "Reading gene model .../Splitting .../
      Done." were wrongly gated behind `--verbose` (upstream's
      `logging.info` calls are unconditional at INFO level, same
      "verbose only raises DEBUG threshold" mistake as
      split_paired_bam.py had), and a "Loaded exon intervals for N
      chromosome(s)" line was missing entirely. Verified via live diff
      (content matches exactly after stripping upstream's timestamp
      prefix, same DIV-0019-style verification -- not asserted in the
      automated harness since the timestamp itself can never be
      byte-reproduced regardless of message content).
    classification: >
      explicit-compatibility-exception (divide_bam.py's --index);
      upstream-bug (split_paired_bam.py's and split_bam.py's
      --index-output crash, see above)
    decision: All three flags implemented and functional in this port. divide_bam.py's --index verified via live diff against real upstream. split_paired_bam.py's/split_bam.py's --index-output cannot be live-diffed against a permanently-crashing upstream CLI in this environment; verified instead via a real pysam indexed-fetch probe against the Rust-produced .bai. If a future upstream release fixes the -f typo, re-verify with a live diff at that point.
    status: fixed-working-tree

  - id: DIV-0007
    command_or_api: bam2fq.py
    description: >
      CLOSED 2026-09-17. `-c/--compress` gzips each output FASTQ file
      after writing, via the `flate2` crate at compression level 9
      (matches Python's `gzip.open` default `compresslevel`). Verified
      via live diff: stderr's "Compressing <path> ..."/"Compression
      complete." lines match exactly, and the DECOMPRESSED content of
      both sides' .gz output is byte-identical (see
      verification/run_diff.py case bam2fq_compress). The .gz
      CONTAINER's own bytes are not, and cannot be, byte-identical
      between the two sides: Python's `gzip.open(path, 'wb')` stamps the
      current wall-clock time into the gzip header on every run, so even
      two runs of the real upstream CLI never produce identical .gz
      bytes for the same input -- this is not a divergence to fix, just
      an inherent property of the format upstream itself has.
    classification: explicit-compatibility-exception
    decision: Closed. Compressed FASTQ/FASTA INPUT (a separate, still-open gap for sc_seqQual.py/sc_seqLogo.py, not covered by this entry) can reuse the same flate2 dependency once undertaken.
    status: fixed-working-tree

  - id: DIV-0008
    command_or_api: read_NVC.py
    description: >
      Upstream's readsNVC() data table has as many rows as the LENGTH OF THE
      LAST RECORD PROCESSED in file order (the `RNA_read` variable retains
      its final loop-iteration value after the read loop exits), not the
      maximum read length seen across the file. If the last record is
      shorter than earlier records, the table is silently truncated to that
      shorter length -- almost certainly an unintentional upstream bug, but
      it is directly observable in the output file's row count.
    classification: upstream-bug
    decision: Preserved exactly in the Rust port (compatibility mode) rather than silently "fixed" to use max length, per PORTING_PLAN.md Step 1.7 ("do not silently 'correct' an algorithm in compatibility mode"). A corrected behavior may be offered later as an explicit separate mode.
    status: accepted

  - id: DIV-0009
    command_or_api: read_quality.py
    description: >
      Same pattern as DIV-0008: upstream's readsQual_boxplot() iterates
      `range(0, read_len)` to build the output R script, where `read_len` is
      whatever the LAST processed record's length happened to be, not the
      max across the file.
    classification: upstream-bug
    decision: Preserved exactly, same rationale as DIV-0008.
    status: accepted

  - id: DIV-0010
    command_or_api: clipping_profile.py
    description: >
      Same last-record-length pattern as DIV-0008/DIV-0009, one further
      twist: upstream's `read_pos = list(range(0,len(cigar_str)))` uses
      whichever record's expanded CIGAR string was computed LAST among all
      records that pass the mapq/unmapped/qc-fail (and, in paired mode,
      is_paired) filters -- including records that end up contributing
      nothing to the histogram because they have no clip/insertion
      operation at all (the `if type not in cigar_str: continue` skip
      happens after `cigar_str` is (re)assigned each iteration).
    classification: upstream-bug
    decision: Preserved exactly, same rationale as DIV-0008.
    status: accepted

  - id: DIV-0011
    command_or_api: tin.py
    description: >
      Upstream's genebody_coverage() calls pysam.AlignmentFile.pileup()
      with no explicit flag_filter/min_base_quality/ignore_overlaps
      arguments, so pysam's own defaults silently apply:
      flag_filter=BAM_FUNMAP|BAM_FSECONDARY|BAM_FQCFAIL|BAM_FDUP (excludes
      duplicate-flagged reads from coverage, unlike check_min_reads/
      estimate_bg_noise which use fetch() with no such filter and so DO
      count duplicates -- a real asymmetry, replicated in the Rust port);
      min_base_quality=13 (bases below phred 13 excluded from coverage --
      replicated); and ignore_overlaps=True (overlapping paired-end mates
      at a shared reference position are deduplicated, counting only the
      higher-quality base once -- now replicated in the Rust port by
      template-name grouping). The default max_depth=8000 is also enforced
      per pileup column. Also, query_length used by
      estimate_bg_noise is taken from the read's SEQ length rather than
      reproducing pysam's CIGAR-based inference fallback for a missing SEQ
      ("*"), a case expected to be rare in practice.
    classification: unimplemented-pysam-default
    decision: >
      flag_filter, min_base_quality, max_depth, and ignore_overlaps are now
      implemented in the working tree and covered by deterministic oracle
      regressions. The implementation groups paired pileup bases by QNAME and
      retains the higher-quality base. This closes the reproduced overlap and
      depth mismatches for the tested profile, but malformed pairing, unusual
      QNAME reuse, and exact htslib admission order remain outside the current
      tiny fixture; retain this item for independent real-data review.
      2026-09-28 (synthetic sweep): the "higher-quality mate wins" rule was
      replaced by a port of htslib's tweak_overlap_quality (summed quality
      for matching bases, 0.8x for mismatches, deletion catch-up, name-hash
      side selection), applied only to proper pairs as overlap_push does,
      and pysam's default "samtools" stepper's ignore_orphans=True (paired
      but not properly paired reads never enter the pileup) is now
      honoured. Shared by tin.py and geneBody_coverage.py; see run_diff
      cases genebody_coverage_synthetic_pileup / tin_synthetic_pileup.
    status: fixed-working-tree

  - id: DIV-0012
    command_or_api: RPKM_saturation.py
    description: >
      Upstream's saturation_RPKM re-opens and re-parses the reference
      BED12 gene model file from scratch on every iteration of the outer
      percentile-sampling loop (once per entry in `tmp`, typically ~20
      times at the default -l5/-u100/-s5 settings). Any malformed line's
      "[NOTE:input bed must be 12-column] skipped this line: ..." stderr
      warning is therefore printed once per percentile iteration, not
      once overall. The Rust port parses the gene model exactly once
      (`parse_gene_model`) and reuses the resulting `Vec<TranscriptExons>`
      across all percentiles, since the file's content and the parse
      outcome cannot change between iterations.
    classification: acceptable-simplification
    decision: >
      Preserving the literal re-parse-per-iteration behavior would only
      reproduce duplicated stderr diagnostic noise for malformed input
      lines; it has no effect on any computed output (.eRPKM.xls,
      .rawCount.xls, or the R script). Parsing once is strictly better
      and does not change program behavior observable in output files.
    status: accepted

  - id: DIV-0013
    command_or_api: RPKM_saturation.py
    description: >
      Upstream's show_saturation() writes the `pdf(...)` and
      `par(mfrow=c(2,2))` lines to the `.saturation.r` file BEFORE
      computing `plot_headers = header[:-1]` inside the first quantile
      iteration; if `plot_headers` turns out to be empty (fewer than two
      sampling percentiles), it raises ValueError mid-write, leaving a
      truncated two-line R script on disk. The Rust port
      (render_saturation_r_script) checks this condition up front and
      returns an error before writing anything, so no partial file is
      produced.
    classification: acceptable-simplification
    decision: >
      A truncated, unusable R script is not a meaningful artifact to
      reproduce byte-for-byte; both implementations fail the command with
      a hard error in this case (an edge case requiring
      --percentile-step >= --percentile-ceiling - --percentile-floor).
      Not writing a broken partial file is strictly better behavior.
    status: accepted

  - id: DIV-0014
    command_or_api: geneBody_coverage2.py
    description: >
      The "skip transcripts shorter than 100bp" check in
      coverage_gene_body_bigwig() is misplaced INSIDE the per-exon
      accumulation loop (checked and breaking immediately after each
      exon is added) rather than after the full loop completes (contrast
      geneBody_coverage.py's sibling function, which checks the total
      length only once, after accumulating every exon). Because the
      running total only ever grows, a multi-exon transcript is skipped
      entirely unless its FIRST exon alone already has >=100 bases, even
      if the full spliced transcript is well over 100bp. Most real
      multi-exon transcripts with small individual exons therefore fail
      this filter and are silently excluded, regardless of total mRNA
      length.
    classification: upstream-bug
    decision: >
      Preserved exactly, same rationale as DIV-0008/DIV-0009/DIV-0010:
      this project replicates upstream algorithmic behavior faithfully,
      including bugs, and documents them here rather than silently
      "fixing" them.
    status: accepted

  - id: DIV-0015
    command_or_api: overlay_bigwig.py
    description: >
      The '-a Division' action is uncallable under Python 3.
      qcmodule.twoList.Division computes `(v1+1).__div__(v2+1)`, and
      `__div__` is a Python-2-only ndarray dunder method that numpy does
      not implement under Python 3 (only `__truediv__`/`__floordiv__`
      exist) -- calling it always raises an uncaught AttributeError,
      crashing the program with a traceback. This is not caught by the
      CLI's own `except (OSError, ValueError, RuntimeError)` clause
      (AttributeError is none of those). Confirmed by directly importing
      and calling qcmodule.twoList.Division in oracle/venv.
    classification: upstream-bug
    decision: >
      Preserved as dead/uncallable functionality: the Rust port's
      '-a Division' returns an immediate hard error rather than either
      implementing a working division (which upstream cannot actually
      perform today) or silently succeeding. Same rationale as
      DIV-0008/DIV-0009/DIV-0010/DIV-0014 -- replicate upstream behavior
      faithfully, including confirmed bugs, and disclose them here
      rather than silently "fixing" them into different (better)
      behavior than upstream actually has.
    status: accepted

  - id: DIV-0016
    command_or_api: sc_seqLogo.py
    description: >
      PARTIALLY CLOSED 2026-09-17; CLOSED 2026-09-18. Upstream's
      sequence-logo images (.logo.<format> and
      .logo.mean_centered.<format> -- upstream's make_logo() actually
      produces TWO files, not one) are rendered by
      qcmodule.fastq.make_logo, which calls the Python logomaker
      library directly (matplotlib-based), not R -- unlike every other
      DIV-0005 "plot" command, there's no R-script intermediate to fall
      back to.

      `--oformat svg`, `--oformat png`, AND `--oformat pdf` now all
      produce real images: svg via `crates/render::seqlogo` (a
      from-scratch SVG renderer), png via `crates/render::seqlogo_png`
      (a from-scratch rasterizer using a tiny embedded 5x7 bitmap font,
      `crates/render::bitmap_font`, and the pure-Rust `png` crate for
      encoding -- no system libpng dependency). Both share the same
      stacking/ordering computation and color scheme
      (`crates/render::seqlogo`'s `order_indices`/`base_color_rgb`), so
      they agree on WHAT to draw; neither is a logomaker/matplotlib
      port. pdf (`crates/render::pdf`) wraps the PNG renderer's exact
      RGB raster (`Canvas`) in a minimal single-page PDF 1.4 image
      XObject (raw uncompressed DeviceRGB, hand-written object/xref
      tables, no PDF-crate dependency) -- the same underlying data as
      svg/png, so it draws the same logo. All three encode the same
      DATA -- per-position letter-stack height by relative frequency
      (plain logo) or by each position's count minus its own mean
      (mean-centered logo, with below-axis letters flipped), upstream's
      exact {A:green, C:blue, G:orange, T:red, N:grey} color scheme,
      stack_order, and highlighted position range -- not a byte-for-
      byte or even pixel-similar reproduction of matplotlib's own
      rendering (no independent renderer can match that). Verified
      visually (rendered a real fixture, inspected the actual PNG/SVG
      images directly) in addition to the automated checks below.
      Known, disclosed gaps: no real font-metrics/hinting/anti-
      aliasing (glyphs are approximate, nearest-neighbor-scaled, not
      exact outlines); shade_below/fade_below are not honored (both
      default to 0.0 in the CLI's own flags, so this only matters if a
      caller overrides them).

      A genuine upstream quirk was found and preserved exactly while
      implementing this: the "Mean-centered logo saved to ..."
      progress line names the file `<prefix>.logo_mean_centered.
      <format>` (underscore) via make_logo()'s own log string, but the
      REAL file plt.savefig(...) writes is
      `<prefix>.logo.mean_centered.<format>` (dot-separated) -- the two
      literally don't match in upstream's own source. Reproduced
      exactly, not "corrected".

      Verification is necessarily partial: the real logomaker+pandas
      combination installed in this project's own oracle environment
      crashes on EVERY invocation regardless of format (a genuine,
      pre-existing version-incompatibility bug unrelated to this port
      -- pandas now raises TypeError on an implicit int64->float
      downcast logomaker's _center_matrix relies on), so there is no
      working reference image to live-diff against for ANY format,
      not just svg. What WAS verified via live diff: every stderr
      progress line up to and including "Mean-centered logo saved to
      ..." matches real upstream byte-for-byte (content, ignoring the
      timestamp prefix), including the underscore/dot filename
      mismatch quirk above -- confirmed for BOTH svg and png (the
      shared progress-message code path doesn't branch on format); the
      .count_matrix.csv output (already closed, unaffected by this
      work) remains byte-identical for all three formats; produced
      .svg files are well-formed XML (parsed with Python's own
      xml.etree.ElementTree), produced .png files decode cleanly
      (confirmed with both the `file` utility and a round-trip decode
      in this port's own unit tests), and produced .pdf files are
      recognized as one-page PDF 1.4 documents by the `file` utility
      with structurally verified xref/object tables in this port's own
      unit tests. The automated run_diff.py case `sc_seqlogo_basic`
      covers the whole command end-to-end: it compares the
      .count_matrix.csv byte-identically (written by both sides) and
      asserts the two PDF logos exist on the candidate side only, since
      the two sides now deliberately diverge in exit code (upstream
      crashes on its own logomaker+pandas bug, this port succeeds) for
      a reason outside this port's control -- same reasoning as
      DIV-0006's split_paired_bam.py/split_bam.py --index-output cases.
      The case declares that asymmetry explicitly via the harness's
      per-side exit overrides (`py_expected_exit`/`rust_expected_exit`)
      and candidate-only `rust_expect_files`; equal-failure is never a
      pass.
    classification: explicit-compatibility-exception
    decision: >
      svg, png, and pdf output are all implemented and functional, all
      sharing the same from-scratch rendering core and documented
      visual-fidelity caveats (no working upstream reference image to
      match against, since the pinned oracle's own logomaker+pandas
      combination crashes before rendering for EVERY format). Closed:
      no format remains unimplemented.
    status: fixed-working-tree

  - id: DIV-0017
    command_or_api: divide_bam.py
    description: >
      Upstream seeds Python's `random.Random(seed)` and calls
      `rng.randrange(n)` once per distinct query name to assign it to an
      output file. The Rust port seeds `rand::rngs::StdRng::seed_from_u64`
      and calls `rng.gen_range(0..n)`. Both are deterministic given the
      same seed (same-language, same-run reproducibility is preserved),
      but the two RNG algorithms and their stream-to-integer mappings are
      different implementations, so `--seed N` does NOT assign the same
      query names to the same output-file indices across the Python and
      Rust builds -- only within one implementation across repeated runs.
    classification: permitted-serialization-difference
    decision: >
      Cross-language bit-for-bit RNG stream reproduction is out of scope
      (no user-facing contract depends on the assignment itself, only on
      "paired mates stay together" and "roughly equal subset sizes",
      both of which hold in either implementation). Not planned for
      closure.
    status: accepted

  - id: DIV-0018
    command_or_api: sc_bamStat.py
    description: >
      Upstream's `qcmodule.scbam.mapping_stat` writes per-chromosome
      intermediate files (`<chrom>.all_reads_id.txt`/
      `<chrom>.confident_reads_id.txt`) into the CURRENT WORKING
      DIRECTORY (fixed names, not scoped to any output prefix or flag),
      shells out to `awk '!a[$0]++' *.all_reads_id.txt | tee
      All_reads_uniqID.txt | wc -l` (and the confident-reads equivalent)
      to deduplicate read IDs and count them, deletes the per-chromosome
      temp files afterward, but LEAVES `All_reads_uniqID.txt`/
      `confident_reads_uniqID.txt` behind permanently in whatever
      directory the command was invoked from. The Rust port computes the
      identical counts directly via an in-memory `HashSet<String>` (see
      crates/commands/src/sc_bamstat.rs module docs) and does not shell
      out to `awk`/`wc`/`tee` or write ANY of these intermediate/leftover
      files -- the printed stdout report (the actual data output) is
      unaffected and verified byte-identical.
    classification: explicit-compatibility-exception
    decision: >
      Deliberately not replicated. This is fixed-name, unscoped CWD
      pollution with no `-o`/prefix control in upstream's own CLI --
      blindly reproducing it would risk silently clobbering an existing
      file of the same name in whatever directory the Rust binary is
      invoked from, for no benefit (nothing downstream in the standard
      workflow consumes these files; they exist only as an artifact of
      upstream's `awk`-based dedup-counting implementation detail, not a
      documented output of the command). If a real consumer is found
      that depends on these specific files, revisit.
    status: accepted

  - id: DIV-0019
    command_or_api: sc_bamStat.py
    description: >
      Upstream configures Python's `logging` module at INFO level
      (unconditionally -- `--verbose` only raises it to DEBUG, it is NOT
      required for INFO output) and emits a full per-chromosome progress
      trail: "Reading BAM file ... ", one "Processing \"<chrom>\" ..." /
      "Processed N alignments from \"<chrom>\"" pair per chromosome in
      the BAM header (even chromosomes with zero alignments -- the loop
      iterates `samfile.references` unconditionally), "Processing total
      N alignments ...", "Count total/confidently mapped reads ...",
      "Removing intermediate files ...", "Done." -- each line prefixed
      with a `%(asctime)s [%(levelname)s]` timestamp.
    classification: explicit-compatibility-exception
    decision: >
      CLOSED (content-complete) as of 2026-09-17: `mapping_stat` in
      crates/commands/src/sc_bamstat.rs was restructured to group its
      single streaming pass by consecutive `reference_sequence_id` runs
      (assuming coordinate-sorted input, same assumption upstream's own
      `require_index` already implies) and now emits every one of the
      lines above, in the same order, with the same content -- verified
      via a live diff against the real upstream CLI (every line matched
      after stripping the timestamp+level prefix; stdout, the actual
      data report, was already and remains byte-identical). Restructuring
      this way also fixed a latent, previously-undetected exclusion bug:
      upstream's per-chromosome `samfile.fetch(chr_id)` never visits a
      read whose reference doesn't resolve to any header chromosome (a
      truly unmapped read with no RNAME), silently excluding it from
      EVERY count -- the port's old flat sequential scan counted such
      reads, a real (if likely rare in practice) divergence, now fixed
      by the same restructuring. NOT reclassified to "accepted": the
      `%(asctime)s [%(levelname)s]` timestamp prefix still makes
      byte-exact stderr comparison impossible in principle, so this can
      never be a `run_diff.py` exact-stream-comparison target the way
      other commands' progress lines are -- that specific formatting
      gap remains, by design, not by omission.
    status: accepted

  - id: DIV-0020
    command_or_api: sc_seqQual.py, sc_seqLogo.py
    description: >
      CLOSED 2026-09-17. Upstream's `qcmodule.ireader.nopen` transparently
      decompresses input by file extension: `.gz`/`.Z`/`.z` (gzip,
      including the historically-mismatched `.Z` compress(1) extension,
      which upstream ALSO routes to `gzip.open` -- reproduced exactly,
      including that a genuine LZW `.Z` file would fail identically on
      both sides) and `.bz`/`.bz2`/`.bzip2` (bzip2). Neither
      `sc_seqQual.py` nor `sc_seqLogo.py` supported this previously (no
      compression crate had been added). Added
      `rseqc_formats::open_text_input`, dispatching on the exact
      case-sensitive extension match (matching upstream's own
      `str.endswith` check, not a case-insensitive one) via `flate2`'s
      `MultiGzDecoder` (matches Python gzip's transparent multi-member
      support) for gzip and the pure-Rust, decode-only `bzip2-rs` crate
      for bzip2 (no system libbz2 dependency). Verified via live diff for
      both `.gz` and `.bz2` input against real upstream on
      `sc_seqQual.py` (byte-identical `.qual_count.csv`/
      `.qual_percent.csv`) and `.gz` input on `sc_seqLogo.py`
      (byte-identical `.count_matrix.csv`; both sides still exit
      non-zero for the separate, still-open DIV-0016 logo-image gap,
      unrelated to input decompression). See `verification/run_diff.py`
      case `sc_seqqual_gzip_input`.
    classification: explicit-compatibility-exception
    decision: Closed. Independent of DIV-0016 (sc_seqLogo.py's native image rendering, since closed separately) -- this entry covers input decompression only.
    status: fixed-working-tree

  - id: DIV-0021
    command_or_api: clipping_profile.py, deletion_profile.py, geneBody_coverage.py,
      geneBody_coverage2.py, inner_distance.py, insertion_profile.py,
      junction_annotation.py, junction_saturation.py, mismatch_profile.py,
      read_duplication.py, read_GC.py, read_NVC.py, read_quality.py,
      RPKM_saturation.py, sc_editMatrix.py, sc_seqQual.py
    description: >
      CLOSED 2026-09-28. Found via a genuine clean-room test (built a real
      distribution archive with `scripts/build-release-archive.sh`, then
      ran the extracted binaries with `PATH` set to ONLY that archive's
      own `bin/` directory -- no Python/R/`wigToBigWig` resolvable at
      all), something this project's README had disclosed as untested
      since Step 10/11 packaging work began. Every core, non-plotting
      command worked fully standalone as expected (confirmed via
      `bam_stat.py` and `sc_seqLogo.py`, the latter including its native
      PDF rendering -- no external tool needed at all). `bam2wig.py`'s
      existing `wigToBigWig`-absent fallback also behaved correctly
      (prints "Failed to call \"wigToBigWig\"." and still writes the
      `.wig` file, matching its own pre-existing documented behavior).

      But the 16 commands that shell out to `Rscript` (via each script's
      own `run_plot_script`/`resolve_rscript` helper) had a real,
      previously-undiscovered gap: upstream ALWAYS pre-resolves the
      configured `--rscript` executable via `shutil.which` before
      attempting to spawn it, producing a friendly, content-specific
      `"Rscript executable not found: <name>"` error (14 commands) or
      `"Rscript executable not found: \"<name>\""` (quoted variant,
      `geneBody_coverage.py`/`geneBody_coverage2.py` only) -- this port
      instead let `std::process::Command::new(&args.rscript).status()`'s
      raw OS spawn-failure `io::Error` propagate unchanged (rendering
      generically as e.g. "No such file or directory (os error 2)"),
      since every development/CI environment this port has been tested
      in already has Rscript installed, so this specific branch had
      never actually been exercised end to end before. Invisible in this
      project's own sandbox; a real gap for a genuine clean-room install
      lacking R.

      Added a shared `rseqc_commands::exec_resolve::which` (a faithful
      `shutil.which` port: explicit-path check if the name contains a
      path separator, otherwise a `$PATH` search, POSIX executable-bit
      semantics) and wired a pre-check into all 16 call sites, matching
      each command's own exact upstream message text and quoting.
      `sc_editMatrix.py`/`sc_seqQual.py` needed the check inserted at the
      START of their `ensure_r_dependencies` equivalent (matching
      upstream's own `resolve_rscript()`-first ordering), before the
      `pheatmap`-availability check -- otherwise a missing Rscript would
      have been misreported as a missing R package instead. `FPKM-UQ.py`
      already had the equivalent check for `htseq-count` (a separate,
      pre-existing, already-correct `resolve_executable`), not touched.

      Verified via the same clean-room test (both `junction_annotation
      .py`'s unquoted and `geneBody_coverage2.py`'s quoted message,
      plus `sc_editMatrix.py`'s `ensure_r_dependencies`-ordering case,
      all byte-identical to real upstream's own clean-room output
      content, timestamp/`{prog}: `-prefix differences aside -- the same
      accepted, permanent formatting divergence every other error/log
      line in this port already has). Not added as a `verification/
      run_diff.py` case: the harness always inherits a PATH that DOES
      have Rscript (needed for the other 60+ passing cases' real-Rscript
      execution), so a PATH-manipulated case would need new harness
      infrastructure for one narrow scenario -- the manual live-diff
      above plus `cargo test`'s new `exec_resolve` unit tests (4 cases:
      bare-name resolution, unresolvable name, explicit-path check
      bypassing `$PATH`, rejecting a non-executable file) were judged
      sufficient rigor, consistent with this project's established
      practice for narrow, manually-verified branches (e.g.
      `overlay_bigwig.py`'s non-`geometricMean` actions before this same
      day's later commit formalized two of them).
    classification: bug-in-port
    decision: Fixed in the working tree 2026-09-28.
    status: fixed-working-tree

  - id: DIV-0022
    command_or_api: geneBody_coverage.py, FPKM-UQ.py
    description: >
      Upstream's `printlog` function (defined in both `geneBody_coverage.py`
      and `FPKM-UQ.py`) writes timestamped progress messages to stderr AND
      appends them to a fixed-name file `log.txt` in the CURRENT WORKING
      DIRECTORY (unscoped to any output prefix or `--log-file` flag; the
      default `Path("log.txt")` is hardcoded in the function signature).
      This is not documented in the CLI help (`-h`/`--help`) for either
      command and is a byproduct of the logging implementation detail, not
      an advertised output. The Rust port's equivalent progress messages
      use `eprintln!` for stderr output only, matching every other command's
      existing practice in this project.
    classification: explicit-compatibility-exception
    decision: >
      Deliberately not replicated. This is fixed-name, unscoped CWD
      pollution with no `-o`/prefix control or `--log-file` flag in
      upstream's own CLI -- blindly reproducing it would risk silently
      clobbering an existing `log.txt` in whatever directory the Rust binary
      is invoked from, for no benefit (nothing downstream in the standard
      workflow consumes this file; it exists only as an artifact of
      upstream's `printlog` logging implementation detail, not a documented
      output of the command). If a real consumer is found that depends on
      this file, revisit. Follows the same precedent and rationale as
      DIV-0018 (sc_bamStat.py CWD file pollution).
    status: accepted

  - id: DIV-0023
    command_or_api: read_NVC.py, read_GC.py, read_quality.py
    description: >
      Found 2026-09-30 while adding the first negative/empty-input branch
      cases to `verification/run_diff.py` (PUBLICATION_PLAN.md 3 item 5 /
      5.1). On a VALID BUT EMPTY BAM -- a real header, a real `.bai`, zero
      alignment records -- upstream's nucleotide-frequency path crashes with
      an unhandled Python `UnboundLocalError` rather than producing a
      report or a diagnostic:

          File ".../qcmodule/SAM.py", line 2995, in readsNVC
      UnboundLocalError: cannot access local variable 'RNA_read' where it
      is not associated with a value

      `RNA_read` is only ever assigned inside the per-read loop of the
      `try:` block that consumes the iterator, so with zero records the name
      is never bound before the post-loop code dereferences it. The same
      shape exists in the sibling per-base commands: `read_GC.py` exits 0 on
      an empty BAM but its report is degenerate, and `read_quality.py` is
      expected to behave likewise (both verified to the extent the pinned
      oracle environment permits).

      This port exits 0 and writes its own (empty-but-valid) report
      instead. That is a real behavioural difference on this input class
      and was previously invisible because all 84 differential cases used
      non-empty fixtures.
    classification: upstream-bug
    decision: >
      NOT replicated. Replicating a Python `UnboundLocalError` traceback
      would mean deliberately reintroducing a crash on a legitimate input
      (an empty-but-valid BAM is a normal thing for a filtering or
      post-processing pipeline to produce), and a stack trace is not a
      portable contract across a language boundary. Per
      PORTING_PLAN.md Step 1.7 the port does not silently "correct"
      algorithms in compatibility mode, so this is scoped narrowly: the
      port's own behaviour on an empty input is to succeed with a
      well-formed, if empty, report, and that difference is declared here
      rather than left implicit.

      It is recorded as `accepted` rather than `fixed` because there is no
      bug in THIS port to fix -- the open question is whether the port
      should instead *also* fail loudly on empty input, to match upstream
      more closely, and that is a product decision, not a bug fix. If a real
      consumer depends on upstream's non-zero exit here, revisit and add
      an explicit empty-input failure mode.
    status: accepted

  - id: DIV-0024
    command_or_api: geneBody_coverage.py, tin.py
    description: >
      OPEN, found 2026-10-02 by the benchmark gate on real data, not by the
      differential suite. On the 8.2M-record rat alignment (SRR1177982, re-aligned
      against the corrected annotation) the two implementations' 100-bin gene-body
      coverage curve diverges: 76 of 100 bins differ, by up to 839 reads in a single
      bin, and in BOTH directions. Bisected to a single 904-base minus-strand
      transcript (chr1:256806475-256813678, NM_013162, 6 exons), committed as
      verification/fixtures/genebody_divergence_minimal.bed12 and regenerable with
      verification/fixtures/check_gene_body_divergence.sh. Aggregated over the full
      5,359-transcript model, one bin differs by 32,697 reads.

      ROOT CAUSE, isolated by construction rather than by inference. A 100-base
      transcript was built in which each 10-base range exercises exactly one pileup
      knob (plain reads; sub-threshold base quality; duplicate flag; an overlapping
      proper pair with identical bases in the overlap; an overlapping proper pair with
      mismatched bases; a paired-but-not-proper orphan; a 20M20D20M deletion; secondary
      and supplementary flags; a plain tail). BED12 base i maps to output bin i, so a
      disagreement localises to one mechanism. ALL NINE KNOBS AGREE EXACTLY.

      The cap was then isolated with the same method: 8,000 / 8,001 / 12,000 uniform
      reads (both arms report exactly 8000, so the cap's VALUE is not the defect),
      then 3 versus 9,000 copies of a single 20M20D20M read. With 3 the arms are
      byte-identical. With 9,000 -- once the cap binds -- they diverge at 50 of 100
      bins. Upstream reports 8000, then 8001..8010, then 11..20, then 8020; the port
      reports a flat 8000, then a flat 0, then 8000. The port is LOW at every
      differing bin, by 1..20 reads: it loses the clean reads that upstream counts,
      because the is_del pileups ahead of them consume the port's per-position budget
      while upstream's buffer budget does not run out.

      SCOPE CORRECTION, 2026-10-02: this is TWO commands, not one. The 18-row
      real-data study also failed `tin`, on the SAME transcript --
      chr1:256806475-256813678, NM_013162, TIN 93.75219481388487 upstream against
      93.85965648789987 in the port, with the sample summary inheriting the
      difference. Both commands reach this behaviour through the same shared
      primitive, `tin::genebody_coverage_with_visited`, so one cause, two commands.
      Confirmed on the synthetic depth_cap fixture with no real-data confound: TIN
      39.570534359417486 upstream against 39.2610946473031 in the port, a difference of
      0.309, reproducible with a single 100-base transcript and 8,100 reads. An earlier
      draft of this entry named only geneBody_coverage, and the disclosure that follows
      it (archive manifest, README, CHANGELOG) had to be corrected with it.

      So the difference is in pysam/htslib max_depth semantics, which the port
      reimplements at crates/commands/src/tin.rs:274-296 as a per-position budget over
      the VISITED set. Upstream's budget is over the pileup buffer, so the port's
      version both (a) lets is_del pileups consume budget that upstream's does not,
      which is why it can report 0 at a position that clean reads demonstrably cover,
      and (b) re-derives membership from scratch at every position, where upstream's
      once-overflow eviction changes which reads remain visible for the rest of their
      span. Which of htslib's two effects dominates is not yet pinned down; what is
      pinned down is that the mechanism is the cap, and that every other filter,
      including the overlap rewriting the port implements as tweak_overlap_quality,
      is equivalent.

      A correction to an earlier draft of this entry: it described upstream as
      building a bx Intersecter over CIGAR M/N blocks with no base-quality filter.
      That is false for this oracle. Upstream calls pysam.AlignmentFile.pileup()
      with only `truncate=True`, so pysam's own defaults apply -- verified against
      the pinned pysam 0.24.1 docstrings: flag_filter =
      BAM_FUNMAP|BAM_FSECONDARY|BAM_FQCFAIL|BAM_FDUP, min_base_quality=13,
      ignore_overlaps=True, ignore_orphans=True, max_depth=8000. Those are the same
      defaults DIV-0011 records, and the port implements all of them.
    classification: candidate-bug
    decision: >
      Recorded as an OPEN divergence and DISCLOSED, deliberately not classified as an
      accepted compatibility difference: the port does not currently reproduce
      upstream's gene-body coverage curve on real data. Consequences applied in the
      same change. First, geneBody_coverage is excluded from any published speedup
      claim, because the benchmark gate refuses to pass it -- which it does, on real
      data. Second, the archive manifest's known_limitations states it. Third,
      verification/fixtures/check_gene_body_divergence.sh re-checks that the defect
      is STILL present on every CI run and inverts its own exit status so it goes
      green when the divergence is fixed, at which point this entry and that CI step
      must change together. Fourth, the differential suite has a deep-coverage
      deletion fixture that binds the cap -- synthetic_data.py emits 8,100 copies of
      one 20M20D20M read -- and two cases assert this divergence WITH A FLOOR rather
      than tolerating it (genebody_coverage_depth_cap_divergence,
      tin_depth_cap_divergence), so a fix trips them and names this entry to retire.
      Before that fixture existed, run_diff.py passed 90/90 while both commands were
      wrong on real data, so its greenness said nothing about either of them.
    status: open
  - id: DIV-0025
    command_or_api: all commands with an --out-prefix
    description: >
      ACCEPTED serialization difference, bounded and deliberate. Upstream raises a
      missing output directory from argparse's `parser.error()`, which prints
      argparse's own two-line usage summary above the message:

          usage: read_NVC.py [-h] -i INPUT_FILE -o OUTPUT_PREFIX [-x] [-q INT]
                             [--skip-plot] [--rscript PATH] [--version]
          read_NVC.py: error: output directory does not exist: /absent/dir

      The port prints only the message, because its argument parser is clap and clap
      renders its own usage text. The operative `prog: error: <message>` line and the
      exit status (2) match upstream exactly; only the usage block above them
      differs. Verified by the differential cases
      read_NVC_missing_output_dir, read_GC_missing_output_dir,
      geneBody_coverage_missing_output_dir and junction_annotation_missing_output_dir,
      which compare the final error line and both exit codes.
    classification: permitted-serialization-difference
    decision: >
      Do not hand-replicate argparse's usage string per command. argparse formats
      usage from its own option table with its own wrapping rules; reproducing 33 of
      those strings by hand is a way to introduce 33 chances to be subtly wrong, and
      the usage block has no consumer. The message and the exit status are the parts
      a script can branch on, and those are compared. Any future change that alters
      the message text or the exit status for this condition fails the four
      differential cases above.
    status: accepted

  - id: DIV-0026
    command_or_api: bam2wig.py, bam2fq.py
    description: >
      ACCEPTED upstream inconsistency, deliberately replicated. 24 of the 26 upstream
      scripts that take an output prefix refuse a missing parent directory in
      `validate_args`, before reading any input, with exit 2. `bam2wig.py` and
      `bam2fq.py` are the two that do not: they proceed to the work and fail on the
      first output open, with exit 1 and `[Errno 2] No such file or directory:
      '.../out.wig'`. A port that added the check to these two would disagree with
      upstream on an input upstream accepts, and every comparison would then
      diverge on a case that is not a defect in the port. The message text also
      differs by construction here -- Python's OSError repr against Rust's
      io::Error Display -- so only the exit status is compared, by the differential
      case bam2wig_missing_output_dir_is_upstream_inconsistent.
    classification: permitted-serialization-difference
    decision: >
      The check is absent from these two binaries on purpose, with an in-source note
      at the point of omission so a later reader does not "fix" it. The port is
      allowed to be better than its source only where the difference cannot change
      an accepted invocation's outcome; here it would.
    status: accepted

  - id: DIV-0027
    command_or_api: geneBody_coverage2.py
    description: >
      ACCEPTED serialization difference, in the direction of a better diagnostic. On a
      gene model that extends past the last base of a chromosome in the supplied BigWig,
      BOTH implementations now refuse the input and exit 1. Upstream's message is
      pyBigWig's, `Invalid interval bounds!`, which names neither the transcript, the
      chromosome, the position nor the length. The port's names the sampled position, the
      chromosome and its length: `gene model position 195471972 on 1 lies outside that
      chromosome in the BigWig (195471971 bp)`.

      Found 2026-10-02 by verification/verify_stream_declarations.py, which runs each
      declared command once and compares its outcome against upstream's. This command
      SUCCEEDED where upstream refused: the port's BigWig reader returns NaN for an
      out-of-range interval instead of failing, and that NaN was being mapped to 0.0. A
      gene model extending past a chromosome's last base therefore produced a confident
      coverage curve in which the uncovered tail contributed nothing -- the audit's "no
      silent metric loss and no successful corrupt output" failure, in a scientific
      command, and the mirror image of the three declaration bugs the same tool found.

      The port now refuses. Asserted by the differential case
      geneBody_coverage2_model_past_chromosome_end (exit status on both sides) and by two
      unit tests, one pinning the refusal and one pinning that a model inside the
      chromosome is still accepted -- because a refusal that turns into a blanket failure
      would be its own silent metric loss.
    classification: permitted-serialization-difference
    decision: >
      Keep the clearer message and do not reproduce pyBigWig's text. Matching it exactly
      would mean shipping a diagnostic that does not say what went wrong, in exchange for
      byte parity on a string no caller parses. The exit status, which is the part
      behaviour can depend on, matches.
    status: accepted
