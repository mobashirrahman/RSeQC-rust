[package]
name = "rseqc-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
# Cargo bin names can't contain '.'; the packaging step (PORTING_PLAN Step 10)
# creates a `bam_stat.py` symlink/copy of this binary for PATH invocation
# under the original upstream name.
name = "bam_stat"
path = "src/main.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `split_paired_bam.py`.
name = "split_paired_bam"
path = "src/bin/split_paired_bam.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `bam2fq.py`.
name = "bam2fq"
path = "src/bin/bam2fq.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `divide_bam.py`.
name = "divide_bam"
path = "src/bin/divide_bam.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `read_GC.py`.
name = "read_GC"
path = "src/bin/read_GC.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `read_NVC.py`.
name = "read_NVC"
path = "src/bin/read_NVC.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `read_quality.py`.
name = "read_quality"
path = "src/bin/read_quality.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `read_duplication.py`.
name = "read_duplication"
path = "src/bin/read_duplication.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `clipping_profile.py`.
name = "clipping_profile"
path = "src/bin/clipping_profile.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `insertion_profile.py`.
name = "insertion_profile"
path = "src/bin/insertion_profile.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `deletion_profile.py`.
name = "deletion_profile"
path = "src/bin/deletion_profile.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `mismatch_profile.py`.
name = "mismatch_profile"
path = "src/bin/mismatch_profile.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `infer_experiment.py`.
name = "infer_experiment"
path = "src/bin/infer_experiment.rs"

[[bin]]
# Same naming note as above: packaging aliases this to `RNA_fragment_size.py`.
name = "RNA_fragment_size"
path = "src/bin/rna_fragment_size.rs"

[dependencies]
rseqc-core = { path = "../core" }
rseqc-formats = { path = "../formats" }
rseqc-commands = { path = "../commands" }
clap = { version = "4", features = ["derive"] }
noodles-bam = "0.95.0"
noodles-sam = "0.90.0"
rand = "0.8"
