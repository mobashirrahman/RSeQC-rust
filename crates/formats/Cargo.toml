[package]
name = "rseqc-formats"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
noodles-bam = "0.95.0"
noodles-bgzf = "0.51.0"
noodles-sam = "0.90.0"
# .cram input for open_alignments (DIV-0004's remaining .cram remnant).
# Decodes with the DEFAULT (empty) reference-sequence repository --
# correctly handles embedded-reference or reference-free CRAM (the
# common case when no external FASTA is configured, which is also what
# pysam/htslib themselves fall back to when writing CRAM without an
# explicit reference: `embed_ref=2`). A CRAM file that genuinely
# requires EXTERNAL reference resolution (not embedded) will error
# instead of silently producing wrong data -- see open_alignments' own
# doc comment for why that's a disclosed, deliberate scope limit
# rather than something to fix by adding network-based reference
# auto-fetch (upstream's own commands don't expose a --reference flag
# either, and this project is offline-first by design).
noodles-cram = "0.99.0"
# Empty reference-sequence repository for the container-streamed CRAM
# decode (B3): `slice.records()` takes the repository by value, and this
# build resolves no external reference by design, so each container is
# decoded against `Repository::default()`. Already in Cargo.lock via
# noodles-cram 0.99.0 (which uses noodles-fasta 0.66.0); direct here
# because open_alignments names the type itself.
noodles-fasta = "0.66"
rseqc-core = { path = "../core" }
thiserror = "2"
# Pure-Rust BigWig reader (no write/remote/cli support needed -- only
# geneBody_coverage2.py/normalize_bigwig.py/overlay_bigwig.py read
# BigWig input, none of them write it). Same tier of dependency as the
# noodles-* crates: a mature format library for a real compressed,
# indexed binary format, not something to hand-roll.
bigtools = { version = "0.5", default-features = false, features = ["read"] }
# Compressed FASTA/FASTQ input (sc_seqQual.py/sc_seqLogo.py, matching
# upstream's qcmodule.ireader.nopen extension dispatch). flate2 for
# .gz/.Z/.z (multi-member gzip, matching Python's gzip module's own
# transparent-concatenation behavior); bzip2-rs (pure Rust, decode-only,
# no system libbz2 dependency) for .bz/.bz2/.bzip2.
flate2 = "1.1.10"
bzip2-rs = "0.1.2"

[dev-dependencies]
noodles-core = "0.20.0"
proptest = "1.4"
tempfile = "3"
bzip2 = "0.5"
