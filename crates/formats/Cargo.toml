[package]
name = "rseqc-formats"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
noodles-bam = "0.95.0"
noodles-bgzf = "0.51.0"
noodles-sam = "0.90.0"
rseqc-core = { path = "../core" }
thiserror = "2"
# Pure-Rust BigWig reader (no write/remote/cli support needed -- only
# geneBody_coverage2.py/normalize_bigwig.py/overlay_bigwig.py read
# BigWig input, none of them write it). Same tier of dependency as the
# noodles-* crates: a mature format library for a real compressed,
# indexed binary format, not something to hand-roll.
bigtools = { version = "0.5", default-features = false, features = ["read"] }
