[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/formats",
    "crates/commands",
    "crates/render",
    "crates/cli",
    "crates/python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
# UNRESOLVED PLACEHOLDER. The permanent repository URL is a maintainer decision
# (release Stage A) and is deliberately left as TBD rather than guessed: a wrong
# URL in published package metadata is worse than an obviously incomplete one,
# because it resolves to somebody else's page. `scripts/check_release_metadata.py`
# fails a release build while this is still TBD, so the placeholder cannot ship
# unnoticed.
repository = "https://github.com/TBD/rseqc-rust"

[profile.release]
lto = true
codegen-units = 1
