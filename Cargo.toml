[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/formats",
    "crates/commands",
    "crates/render",
    "crates/cli",
    "crates/python",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
# Repository URL set 2026-10-04 (release Stage A decision made): the project now
# lives at the address below. `scripts/check_release_metadata.py` still guards
# this field, so a regression to a placeholder fails the release build.
repository = "https://github.com/mobashirrahman/RSeQC-rust"

[profile.release]
lto = true
codegen-units = 1
