# E2 human whole-genome workloads — dataset manifest
#
# Staged 2026-10-05 for card E2 (protocol-v2 §4 production scale). This is
# NOT part of the T4 held-out panel (datasets/manifest.yaml, one-way door):
# it lives outside datasets/heldout/ deliberately, so nothing here can be
# mistaken for untouched validation data. These BAMs serve the performance
# study (timing/memory at production scale) and parity spot-checks on the
# way in; scientific-endpoint claims are out of scope for E2 either way.
#
# Why public BAMs instead of aligning locally: a whole-genome GENCODE
# human STAR index does not build on this machine (OOM-killed 3x at
# junction insertion; see datasets/build_star_index.sh), and protocol-v2 §3
# prefers public, independently aligned BAMs where local indexing is
# impractical. A BAM from this repo's own generator would also test the
# port against its own assumptions.
#
# Source: ENCODE experiment ENCSR100SIL (polyA mRNA RNA-seq on primary
# keratinocytes, day 6 of differentiation; two biological replicates),
# ENCODE4 uniform pipeline v1.2.4 (STAR 2.5.1b, GENCODE V29) on GRCh38.
# Both files: released status, donor ENCDO615NVN (human), no blocking
# audits (one INTERNAL_ACTION on analysis status bookkeeping only).
# Download URLs: https://www.encodeproject.org/files/<ACCESSION>/@@download/<ACCESSION>.bam
# (also mirrored on S3: s3://encode-public/...; see the file objects).

