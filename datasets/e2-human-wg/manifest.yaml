annotation_note: >
  Aligned against GENCODE V29 by the ENCODE pipeline; the QC BED12 used
  here is derived from the repo-pinned GENCODE v47 GTF
  (datasets/reference/gencode.v47.annotation.gtf.gz) via
  datasets/make_bed12.py over the 25 primary contigs (GENCODE ships no
  alt-contig transcripts, so alt/decoy reads have no BED match by
  construction; regenerable: make_bed12.py --gtf <v47 GTF> --contigs
  chr1..chr22 chrX chrY chrM --out hg38.v47.bed12; 356,707 transcripts).
  Both arms of every comparison use the same BAM+BED, so
  parity and timing hold regardless; only biological interpretation would
  care about the V29/v47 gap, and E2 claims none.

scale_ladder: >
  Small: W-hum-3c (12.3M records, 3 contigs). Intermediate: W-hum-wg-rep1
  (144M records / 66.1M pairs). Production: W-hum-wg-rep2 (233.7M
  records / 103.2M pairs). Measured counts, never requested counts
  (protocol-v2 §4); the AGENT_PLAN "10M and 50M" targets are exceeded,
  not subsetted toward, so no sampling bias is introduced.
