# T4 real-data panel — dataset manifest
#
# Implements `testing.md` §11.1 ("Dataset selection before measuring
# results") and feeds §11.2 (scientific endpoints). Read this file before
# touching any BAM under `datasets/aligned/`: the split below is a one-way
# door, and §11.1 is explicit that "once a held-out case is inspected to
# guide a fix, record that exposure and use fresh independent confirmation
# for claims requiring untouched validation".
#
# STATUS: reference fetched, STAR index building, dev-split FASTQ downloading.
# No BAM has been produced yet, so NO scientific claim is made anywhere in
# this repository. Nothing below has been used to tune any algorithm.

schema_version: 1
created: 2026-09-30
governing: testing.md §11

# ----------------------------------------------------------------------
# Reference
# ----------------------------------------------------------------------
# Pinned by URL and SHA256 in datasets/fetch_reference.sh. GENCODE rather than
# UCSC RefSeq because UCSC has moved/renamed its RefSeq GTF (the path the
# benchmark generator's own docstring names now 404s), and a GENCODE release
# number is a stronger version pin than a filename.
reference:
  genome:
    name: hg38
    assembly: GRCh38
    provider: UCSC
    url: https://hgdownload.soe.ucsc.edu/goldenPath/hg38/bigZips/hg38.fa.gz
    sha256: c1dd87068c254eb53d944f71e51d1311964fce8de24d6fc0effc9c61c01527d4
  annotation:
    name: GENCODE v47 (Ensembl 113)
    provider: GENCODE
    url: https://ftp.ebi.ac.uk/pub/databases/gencode/Gencode_human/release_47/gencode.v47.annotation.gtf.gz
    sha256: df11938c66d2b39f8ebbdb5f1720919321f9cf9d58f02b019753f6a24ca3db24
  bed12_derivation: >
      Converted from the GTF by the transcript loader already committed in
      benchmarks/generate_workload_real.py (`load_transcripts`), so the BED12
      the T4 panel validates against is produced by the same code the
      benchmark workloads use. No transcripts are invented, filtered by
      expression, or subsampled.

# ----------------------------------------------------------------------
# Aligner
# ----------------------------------------------------------------------
# The aligner is part of the result, not a detail: §11.1 requires the manifest
# to record "aligner/options" and states that "differently aligned copies of
# the same reads belong to the same partition". §11.1 also warns that
# "aligner/reference dependence is part of the result" and that robustness
# must not be claimed across aligners from one aligner's BAMs.
#
# Deliberately NOT the project's own tooling. A BAM generated by this
# repository's own generator would test the port against this project's own
# assumptions about transcripts, strand and junctions -- the same closed loop
# that let the sliding-window `tin` regression pass the benchmark suite.
aligner:
  tool: STAR
  version: 2.7.11b
  install: >
      micromamba 2.9.0 (single static binary), environment `t4star` from
      conda-forge + bioconda. No system package manager is present on this
      machine, and the bioconda STAR tarball alone does not run (it needs
      libhts.so.3, which is not installed), so a conda env is the reproducible
      route rather than the convenient one.
  contigs: chr1, chr17, chrM
  parameters:
    sjdbOverhang: 149          # 2*75-1, for 2x100 Illumina
    genomeSAindexNbases: 11    # NOT STAR's recommended 14
    outSAMtype: BAM SortedByCoordinate
  contig_scope_is_a_hardware_limit: >
      A whole-genome GENCODE index does not build on this machine. It was
      OOM-killed three times at "inserting junctions into the genome
      indices" -- at genomeSAindexNbases 14, 11 and 8, and with
      --limitGenomeGenerateRAM honoured. The suffix array is not the binding
      constraint; the junction database built from GENCODE's 2,155,005 exon
      records is, and it is allocated ON TOP of the finished SA index, so
      honouring a RAM limit does not help. Swap is not permitted in this
      container, so the fix had to be a smaller problem, not a slower one.
      The scope is therefore pinned to chr1 + chr17 + chrM, which matches the
      generated benchmark workloads' scope so the two are comparable, and
      still yields 50,725 real transcripts and 311,211 real exons.
      CONSEQUENCE: this panel does not validate whole-genome behaviour. It
      validates the port against upstream on real reads, on three contigs.
  genomeSAindexNbases_note: >
      Reduced from STAR's recommended 14, which needs ~30 GB for human
      against this machine's 31 GB total. A smaller suffix-array index means
      marginally more reads land as ambiguous near boundaries: a real cost,
      recorded rather than left implicit. It does not affect whether the port
      agrees with upstream, because both arms read the same BAM.
  samtools: 1.24              # sort/index the BAM
  provenance_caveat: >
      Every BAM in this panel shares one aligner, one annotation and one
      STAR version. That is a real limit on what can be claimed, and §11.1
      forbids claiming cross-aligner robustness from one aligner's BAMs. The
      panel is honest about testing the PORT against upstream on real reads,
      not about read-alignment method agreement.

# ----------------------------------------------------------------------
# Splits
# ----------------------------------------------------------------------
# §11.1: "Split development and held-out validation at the original
# sample/study level". The split is therefore at STUDY level, not run level:
# two lanes of the same library would be the same sample and are useless as a
# held-out set.
#
# Dev and held-out come from different studies, different submitting
# institutions, and (for the two later strata) different sequencing chemistry
# and a different organism. That is the strongest form of the split this
# project can execute, and it is the reason the panel is worth its cost.
splits:
  development:
    purpose: >
        Everything below is fair game for debugging, adding cases to
        verification/run_diff.py, and fixing defects. No claim is made from it
        alone.
    study: SEQC / MAQC-III main RNA-seq study (human arm)
    bioproject: PRJNA208232
    submitting_institution: New York Genome Center / Broad (SEQC consortium)
    instrument: Illumina HiSeq 2000
    library: cDNA, paired-end 2x100
    conditions: A and C of the SEQC A-E design
    runs:
      - SRR1216016
      - SRR1216063
    exposure: development by definition

  held_out:
    purpose: >
        Inspected ONCE, at final validation, after every port change is
        already committed. Any defect found here is fixed against the
        development split and re-validated on a FRESH run from the same study,
        never by re-inspecting this one.
    strata:
      - id: cross_lab
        description: a different submitting institution, standard Illumina chemistry
        status: not_selected
        rationale: >
            Selection requires confirming the submitting institution from the
            archive rather than assuming it, so this is deliberately left open
            rather than filled with a plausible-looking accession.
      - id: cross_chemistry
        description: >
            A non-Illumina platform (e.g. BGISEQ-500 / DNBSEQ), which
            exercises a different base-quality encoding and therefore a
            different path through the port's quality handling -- the class of
            input where the `min_base_quality` and overlap-quality paths are
            most likely to diverge.
        candidate_study: PRJEB53454
        status: candidate
      - id: cross_organism
        description: >
            A second organism, to test that nothing assumes human chromosome
            naming or a particular transcript structure (§11.1 lists "a second
            organism/reference structure" as a required domain).
        candidate_study: SEQC rat arm, PRJNA239561
        candidate_reference: mRatBN7.2
        status: candidate

# ----------------------------------------------------------------------
# Not yet satisfied
# ----------------------------------------------------------------------
# Listed so the gap is visible rather than implied by silence.
not_yet_covered:
  - domain: single-cell droplet data
    status: absent
    note: >
        The `sc_*` commands are in the differential matrix but have no real
        data. Needs a 10x-style BAM with CB/RE/UB tags and a barcode FASTQ.
        No public dataset has been selected or verified yet.
  - domain: experimentally degraded RNA / RIN series
    status: absent
    note: >
        §11.1 requires this for TIN and gene-body claims. The SEQC A-E design
        provides a dilution series, which is related but is NOT the same
        thing: dilution changes depth, degradation changes the 5'/3'
        profile. A genuine degradation series is still needed before any TIN
        claim.
  - domain: spike-in recovery as an expression endpoint
    status: partial
    note: >
        SEQC contains ERCC spike-in runs, which give a known-truth count
        endpoint. Not yet built into the manifest as a scored endpoint.
  - domain: multiple libraries per domain
    status: absent
    note: >
        §11.1 requires "multiple independent libraries where a biological
        population claim is intended". This panel has one library per
        stratum, so no population-level claim is available from it.
