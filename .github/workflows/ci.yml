name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    name: Build, test, and lint (locked)
    # Multi-platform matrix (PORTING_PLAN Step 10's "supported binary
    # distributions" -- this is the build/test/lint slice of that;
    # scripts/build-release-archive.sh and release.yml remain Linux
    # x86_64-only for now, see their own doc comments). Each OS's own
    # native runner, not cross-compilation, since cross-compiling and
    # testing in one step isn't possible anyway -- native runners also
    # catch genuine platform-specific bugs (path separators, line
    # endings, case-sensitivity assumptions) that cross-compilation
    # alone wouldn't. NOT verified end-to-end in this development
    # sandbox (which only has a Linux x86_64 toolchain) -- verified
    # instead by checking each step against documented GitHub Actions
    # runner behavior; the macOS/Windows legs may need follow-up fixes
    # once they actually run for the first time.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      # rust-toolchain.toml pins the exact channel/components (rustfmt,
      # clippy) this workspace builds with; rustup picks it up
      # automatically once the toolchain file is present in the checkout,
      # on all three platforms (rustup itself is preinstalled on all of
      # GitHub's hosted runner images).
      - name: Install pinned Rust toolchain
        run: rustup show

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      # --locked: fail if Cargo.lock is out of date rather than silently
      # re-resolving dependencies in CI (PORTING_PLAN Step 10: "locked
      # workspace builds").
      - name: cargo build --workspace --locked
        run: cargo build --workspace --locked --release

      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked

      - name: cargo clippy --workspace --all-targets --locked
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      # Exercises scripts/install-aliases.sh end to end (Gate G7's
      # "commands work without source-tree paths") and confirms an
      # original-name alias actually runs the compiled binary, not just
      # that the script exits 0. Linux-only for now: the script assumes
      # a bash shell and Linux-style executable names (no `.exe`), and
      # Windows binary aliasing needs its own handling, not yet written.
      - name: Install PATH aliases and smoke-test one by original name
        if: runner.os == 'Linux'
        run: |
          scripts/install-aliases.sh target/release --copy
          "$(pwd)/target/release/bam_stat.py" --help >/dev/null
          echo "bam_stat.py alias smoke test passed"

  fmt-check:
    name: cargo fmt (advisory, non-blocking)
    runs-on: ubuntu-latest
    # Pre-existing formatting drift predates this workflow (see project
    # notes: `cargo fmt --all -- --check` is not clean repo-wide across
    # many files untouched by any single change). This job reports drift
    # without failing the required build-test-lint job above, so PRs
    # aren't blocked on unrelated files; tighten this once the drift is
    # cleaned up in its own dedicated change.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: cargo fmt --all -- --check
        run: cargo fmt --all -- --check
